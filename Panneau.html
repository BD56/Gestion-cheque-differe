<!doctype html>
<html data-version="2026.10.14-0200">
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        padding: 15px;
        background-color: #f8f9fa;
        margin: 0;
      }
      h3 {
        text-align: center;
        color: #3c4043;
        margin-top: 0;
        font-size: 18px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn-print {
        background-color: #1a73e8;
      }
      .btn-offre {
        background-color: #34a853;
      }
      .btn-mode-signaler {
        background-color: #f2994a;
      }
      .btn-mode-bloquant {
        background-color: #d93025;
      }
      .btn-archive {
        background-color: #d93025;
        margin-top: 20px;
      }

      .date-box {
        background: #e8eaed;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
        text-align: center;
        border: 1px solid #dadce0;
      }
      label {
        font-size: 12px;
        color: #5f6368;
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }
      input[type="date"] {
        width: 90%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      hr {
        border: 0;
        height: 1px;
        background: #ddd;
        margin: 20px 0;
      }

      /* Boîte de légende de l'historique */
      .legend-box {
        background: #fff3cd;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ffeeba;
        margin-bottom: 15px;
        font-size: 12px;
        color: #856404;
      }
      .legend-box h4 {
        margin: 0 0 8px 0;
        font-size: 13px;
        text-align: center;
        color: #d35400;
      }
      .legend-box p {
        margin: 4px 0;
        line-height: 1.4;
      }
      /* Mises en forme autrefois écrites dans le HTML (style="…") */
      .btn-gris {
        background-color: #5f6368;
      }
      .sans-marge-bas {
        margin-bottom: 0;
      }
      .btn-gris-sans-marge {
        background-color: #5f6368;
        margin-bottom: 0;
      }
      .msg-dates {
        font-size: 11px;
        font-weight: bold;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h3>⚙️ Paramètres</h3>

    <button class="btn btn-print" data-action="imprimerAuj">🖨️ VOIR JOUR (AUJ)</button>

    <div class="date-box">
      <label>📅 Voir un jour précédent :</label>
      <input type="date" id="dateImpression" />
      <button class="btn btn-gris-sans-marge" data-action="imprimerAncien">VOIR CE JOUR</button>
    </div>

    <button class="btn btn-offre" data-action="voirOffre">📚 TOUTE L'OFFRE</button>

    <hr />

    <div class="legend-box">
      <h4>📖 Légende des Notes</h4>
      <p><strong>Cas A :</strong> Vrai doublon <em>(Nom & Pièce identiques)</em></p>
      <p><strong>Cas B :</strong> Anomalie / Usurpation <em>(Nom différent, Même Pièce)</em></p>
      <p><strong>Cas C :</strong> Homonyme <em>(Même Nom, Pièce différente)</em></p>
    </div>

    <hr />
    <div class="date-box">
      <label>📅 Opération en cours :</label>
      <input type="date" id="dateDebut" title="Date de début" />
      <input type="date" id="dateFin" title="Date de fin" />
      <button class="btn btn-offre sans-marge-bas" data-action="sauvegarderDatesPC">METTRE À JOUR</button>
      <div class="msg-dates" id="msgDates"></div>
    </div>
    <button class="btn" id="btnMode" data-action="changerMode">⏳ Chargement Mode...</button>
    <button class="btn btn-archive" data-action="cloturer">⚠️ CLÔTURER L'OFFRE</button>
    <button class="btn btn-gris" data-action="reinitialiserPin">🔑 RÉINITIALISER LE CODE RESPONSABLE</button>
    <button class="btn btn-gris" data-action="retirerTablettes">📱 RETIRER TOUTES LES TABLETTES</button>

    <script>
      window.onload = function () {
        const auj = new Date();
        const annee = auj.getFullYear();
        const mois = ("0" + (auj.getMonth() + 1)).slice(-2);
        const jour = ("0" + auj.getDate()).slice(-2);
        document.getElementById("dateImpression").value = annee + "-" + mois + "-" + jour;

        google.script.run.withSuccessHandler(majMode).withFailureHandler(erreurChargement).getInfosPanneau();
      };
      function erreurChargement(err) {
        document.getElementById("btnMode").innerHTML =
          "⚠️ " + (err && err.message ? err.message : "Erreur de chargement");
      }

      // Les actions sensibles sont réservées aux éditeurs du classeur (contrôle serveur).
      function echec(err) {
        alert("⚠️ " + (err && err.message ? err.message : err));
        google.script.run.withSuccessHandler(majMode).withFailureHandler(erreurChargement).getInfosPanneau();
      }

      function reinitialiserPin() {
        if (
          !confirm(
            "Effacer le code responsable ?\n\nUn code d'activation va s'afficher : il permet de créer le nouveau code depuis l'application (n'importe quelle tablette)."
          )
        )
          return;
        google.script.run
          .withSuccessHandler(function (msg) {
            alert(msg);
          })
          .withFailureHandler(echec)
          .reinitialiserPinPanneau();
      }

      function retirerTablettes() {
        if (
          !confirm(
            "Retirer TOUTES les tablettes ?\n\nChacune devra être autorisée à nouveau avec le code responsable (liste pleine, tablettes perdues…)."
          )
        )
          return;
        google.script.run
          .withSuccessHandler(function (msg) {
            alert(msg);
          })
          .withFailureHandler(echec)
          .retirerToutesTablettesPanneau();
      }

      function imprimerAuj() {
        google.script.run.allerVersImpression("aujourdhui");
      }
      function imprimerAncien() {
        const d = document.getElementById("dateImpression").value;
        if (d) google.script.run.allerVersImpression(d);
      }
      function voirOffre() {
        google.script.run.allerVersOffre();
      }

      function changerMode() {
        document.getElementById("btnMode").innerHTML = "⏳ MAJ...";
        google.script.run.withSuccessHandler(majMode).withFailureHandler(echec).basculerModeWebApp();
      }

      function majMode(infosOuMode) {
        const mode = typeof infosOuMode === "string" ? infosOuMode : infosOuMode.mode;
        const btn = document.getElementById("btnMode");
        btn.innerHTML = "🛡️ MODE : " + mode;
        btn.className = mode === "BLOQUANT" ? "btn btn-mode-bloquant" : "btn btn-mode-signaler";
      }

      function cloturer() {
        if (confirm("🚨 CLÔTURE DE L'OFFRE\n\nÊtes-vous sûr de vouloir archiver et vider la liste ?")) {
          google.script.run
            .withSuccessHandler(function (msg) {
              alert(msg);
              // le mode est conservé à la clôture : simple rafraîchissement de l'affichage
              google.script.run
                .withSuccessHandler(majMode)
                .withFailureHandler(erreurChargement)
                .getInfosPanneau();

              // Offre clôturée : les dates affichées sur le panneau sont vidées
              document.getElementById("dateDebut").value = "";
              document.getElementById("dateFin").value = "";
            })
            .withFailureHandler(echec)
            .archiverOffreWebApp();
        }
      }

      // Au chargement, on récupère les dates
      google.script.run
        .withSuccessHandler(function (dates) {
          document.getElementById("dateDebut").value = dates.debut;
          document.getElementById("dateFin").value = dates.fin;
        })
        .withFailureHandler(function (err) {
          document.getElementById("msgDates").textContent =
            "⚠️ " + (err && err.message ? err.message : "Dates non chargées");
        })
        .getDatesOperation();

      function sauvegarderDatesPC() {
        const debut = document.getElementById("dateDebut").value;
        const fin = document.getElementById("dateFin").value;
        const msg = document.getElementById("msgDates");
        msg.style.color = "orange";
        msg.innerHTML = "Enregistrement...";
        google.script.run
          .withSuccessHandler(function (rep) {
            const alerte = rep.indexOf("⚠️") !== -1;
            msg.style.color = alerte ? "#b06000" : "green";
            msg.style.whiteSpace = "pre-line";
            msg.textContent = rep;
            setTimeout(
              function () {
                msg.textContent = "";
              },
              alerte ? 15000 : 3000
            );
          })
          .withFailureHandler(function (err) {
            msg.innerHTML = "";
            echec(err);
          })
          .setDatesOperation(debut, fin);
      }

      // Boutons : data-action="nomDeLaFonction" ; un seul écouteur, liste explicite.
      const ACTIONS = {
        changerMode,
        cloturer,
        imprimerAncien,
        imprimerAuj,
        reinitialiserPin,
        retirerTablettes,
        sauvegarderDatesPC,
        voirOffre,
      };
      document.addEventListener("click", function (e) {
        const el = e.target.closest("[data-action]");
        if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action]();
      });
    </script>
  </body>
</html>
