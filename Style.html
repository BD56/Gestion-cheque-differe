<style data-version="2026.10.14-0200">
  /* Palette « Comptoir » (clair uniquement). Les couleurs d'alerte (danger rouge,
     orange) ne sont jamais adoucies. Police du système : rien à télécharger. */
  :root {

    --surface: #ffffff;
    --encre: #1c1917;
    --doux: #6f6863;
    --trait: #e5dfd8;
    --trait-fort: #d3cbc2;
    --champ: #fbfaf8;
    --accent: #0f766e;
    --accent-fonce: #0b5d57;
    --accent-doux: #e3f1ef;
    --ok: #15803d;
    --ok-doux: #e7f4eb;
    --ok-trait: #bfe0ca;
    --danger: #c81e1e;
    --danger-doux: #fcebea;
    --danger-trait: #f3c1bd;
    --orange: #b45309;
    --orange-doux: #fdf1e2;
    --orange-trait: #f3d3a8;
    --texte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --chiffres: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  /* Largeur = bordure comprise (la carte ne déborde plus sur écran étroit) */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  button,
  input,
  select {
    font-family: inherit;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  /* Icônes (Icones.html) : traits de la couleur du texte */
  .sprite {

    width: 0;
    height: 0;
    overflow: hidden;
  }
  .ico {
    width: 1.15em;
    height: 1.15em;
    flex: 0 0 auto;
    vertical-align: -0.2em;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  html,
  body {
    height: 100%;
  }
  body {
    font-family: var(--texte);

  /* Saisie en 3 étapes numérotées */

  .etape {
    display: grid;
    grid-template-columns: 32px 1fr;

  .valider {

  .input-group {

  /* Tablette en hauteur, téléphone : numéros d'étape masqués, champs les uns sous les autres */
  @media (max-width: 860px) {
    /* En-tête sur deux lignes : marque et boutons, puis l'offre et le mode */
    .haut::after {
      content: "";
      order: 5;
      flex-basis: 100%;
    }
    .haut .puce {
      order: 10;
    }
    .zone-form {
      padding: 18px 16px 16px;
    }
    .etape {
      grid-template-columns: 1fr;
      gap: 0;
    }
    .num {
      display: none;
    }
    .valider {
      width: 100%;
      margin-left: 0;
    }
  }
  @media (max-width: 480px) {

      display: none;

  #zoneImpression {
    display: none;

  @page {
    size: landscape;
    margin: 1cm;
  }
  @media print {
    html,
    body {
      height: auto !important;
      min-height: auto !important;
      overflow: visible !important;
    }
    body {
      background-color: white !important;
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .app {
      display: none !important;
    }
    #modalParametres,
    #modalMentions,
    #modalAide,
    #modalAlerteServeur,
    #ecranAppairage,
    #modalAnnuaire {
      display: none !important;
    }
    #zoneImpression {
      display: block !important;
      width: 100%;
    }
    .table-print {
      width: 100%;
      border-collapse: collapse;
      font-family: sans-serif;
      font-size: 12px;
    }
    .table-print th,
    .table-print td {
      border: 1px solid #000;
      padding: 8px;
      text-align: left;
    }
    .table-print th {
      background-color: #e0e0e0 !important;
      -webkit-print-color-adjust: exact;
      color-adjust: exact;
    }
    .titre-print {
      text-align: center;
      margin-bottom: 20px;
      font-family: sans-serif;
      font-size: 18px;
    }
  }
