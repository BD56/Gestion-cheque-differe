<!-- Mode de sécurité, clôture, dates de l'offre (affichage et réglage). -->
<script data-version="2026.10.17-2353">
  let modeEnCours = false,
    modeActuel = null;
  // Interrupteur Signaler / Bloquant de la vue d'ensemble : un appui sur le mode déjà
  // actif ne fait rien ; sinon bascule (le serveur renvoie le mode réellement écrit)
  function choisirMode(mode) {
    if (mode !== modeActuel) changerMode();
  }
  function changerMode() {
    if (modeEnCours) return; // un double appui ne rebascule pas
    modeEnCours = true;
    document.getElementById("segmentMode").classList.add("en-cours");
    appelAdmin(
      "basculerModeWebApp",
      [],
      function (mode) {
        modeEnCours = false;
        document.getElementById("segmentMode").classList.remove("en-cours");
        majAffichageMode(mode);
        if (cacheVerif) cacheVerif.mode = mode; // contrôle local A/B/C à jour tout de suite
      },
      function () {
        modeEnCours = false;
        document.getElementById("segmentMode").classList.remove("en-cours");
      }
    );
  }

  // Puce du mode dans l'en-tête (le personnel voit si les alertes rouges seront refusées)
  function majPuceMode(mode) {
    const puce = document.getElementById("puceMode");
    document.getElementById("txtMode").textContent = mode === "BLOQUANT" ? "Mode Bloquant" : "Mode Signaler";
    puce.className = mode === "BLOQUANT" ? "puce mode bloquant" : "puce mode";
    puce.style.display = "";
  }

  function majAffichageMode(mode) {
    modeActuel = mode;
    majPuceMode(mode);
    document.getElementById("txtModeAdmin").textContent =
      mode === "BLOQUANT" ? "Mode Bloquant" : "Mode Signaler";
    document.getElementById("puceModeAdmin").className =
      mode === "BLOQUANT" ? "puce mode bloquant" : "puce mode";
    document.getElementById("modeSignaler").setAttribute("aria-pressed", String(mode !== "BLOQUANT"));
    document.getElementById("modeBloquant").setAttribute("aria-pressed", String(mode === "BLOQUANT"));
  }

  // Clôture : confirmée dans la page (« Clôturer maintenant » puis « Clôturer l'offre »)
  function demanderCloture() {
    document.getElementById("confirmerCloture").style.display = "flex";
  }
  function annulerCloture() {
    document.getElementById("confirmerCloture").style.display = "none";
  }
  let clotureEnCours = false;
  function cloturerOffre() {
    if (clotureEnCours) return;
    annulerCloture();
    clotureEnCours = true;
    document.body.style.cursor = "wait";
    appelAdmin(
      "archiverOffreWebApp",
      [],
      function (message) {
        clotureEnCours = false;
        document.body.style.cursor = "default";
        // résultat affiché dans l'écran Opération (plus de fenêtre du navigateur)
        const msg = document.getElementById("msgRetourModal");
        msg.style.color = "var(--ok)";
        msg.style.whiteSpace = "pre-line";
        msg.textContent = sansPicto(message);
        rafraichirEnsemble(false);
        chargerDatesAffichage(); // le mode (SIGNALER / BLOQUANT) est conservé
        rechargerCacheVerif();
      },
      function () {
        clotureEnCours = false;
        document.body.style.cursor = "default";
      }
    );
  }

  // --- DATES DE L'OFFRE : affichage, formulaire ouvert ou fermé ---
  function formaterDateAffichage(dateString) {
    if (!dateString) return "";
    const parts = dateString.split("-");
    return parts.length === 3 ? parts[2] + "/" + parts[1] : dateString;
  }

  // Période de l'offre connue de la tablette (null tant que non chargée)
  let periodeOperation = null;
  function dansPeriode() {
    if (!periodeOperation) return true; // pas encore chargée : le serveur tranchera
    if (!periodeOperation.debut || !periodeOperation.fin) return false;
    const j = new Date();
    j.setHours(0, 0, 0, 0);
    const d = new Date(periodeOperation.debut);
    d.setHours(0, 0, 0, 0);
    const f = new Date(periodeOperation.fin);
    f.setHours(0, 0, 0, 0);
    return j >= d && j <= f;
  }

  function chargerDatesAffichage() {
    google.script.run
      .withSuccessHandler(appliquerDates)
      .withFailureHandler(siNonAutorisee)
      .getDatesOperation(SESSION);
  }

  // Retour au formulaire (après l'encadré de doublon) : seulement pendant l'offre
  function afficherFormulaireSiPeriode() {
    const ouvert = dansPeriode();
    document.getElementById("formulaireSaisie").style.display = ouvert ? "block" : "none";
    document.getElementById("horsPeriode").style.display = ouvert ? "none" : "block";
  }

  // Affiche l'état de l'offre (puce de l'en-tête) et montre/masque le formulaire selon les dates.
  function appliquerDates(dates, sansCache) {
    periodeOperation = dates;
    const puce = document.getElementById("puceOffre");
    const affichage = document.getElementById("sousTitreOperation");
    const formulaire = document.getElementById("formulaireSaisie");
    let isVerrouille = true;
    let etat = "fermee",
      texte = "Aucune opération en cours",
      explication = "Aucune opération en cours : la saisie est fermée.";
    const dateJour = new Date();
    dateJour.setHours(0, 0, 0, 0);

    if (dates.debut && dates.fin) {
      const strDebut = formaterDateAffichage(dates.debut);
      const strFin = formaterDateAffichage(dates.fin);
      const debutObj = new Date(dates.debut);
      debutObj.setHours(0, 0, 0, 0);
      const finObj = new Date(dates.fin);
      finObj.setHours(0, 0, 0, 0);

      if (dateJour >= debutObj && dateJour <= finObj) {
        const jour = Math.round((dateJour - debutObj) / 86400000) + 1;
        const total = Math.round((finObj - debutObj) / 86400000) + 1;
        etat = "en-cours";
        texte = "Offre en cours · " + strDebut + " → " + strFin + " · jour " + jour + " sur " + total;
        isVerrouille = false; // On est dans les dates, on déverrouille !
      } else if (dateJour > finObj) {
        texte = "Offre terminée · du " + strDebut + " au " + strFin;
        explication = "L'offre est terminée (du " + strDebut + " au " + strFin + ") : la saisie est fermée.";
      } else {
        etat = "a-venir";
        texte = "Offre à venir · du " + strDebut + " au " + strFin;
        explication = "L'offre commence le " + strDebut + " : la saisie ouvrira ce jour-là.";
      }
    }
    affichage.textContent = texte;
    puce.className = "puce " + etat;
    // Journal du jour : seulement pendant l'offre (ScriptJournal, lu après ce fichier :
    // absent lors du tout premier affichage, qu'il refait lui-même)
    if (typeof appliquerJournal === "function") appliquerJournal();

    // Verrouillage/Déverrouillage visuel du formulaire (pas par-dessus un encadré de
    // doublon en attente de décision : il réapparaît à ABANDONNER / FORCER)
    const encadreOuvert = document.getElementById("boxConfirmation").style.display === "block";
    if (formulaire && !encadreOuvert) {
      formulaire.style.display = isVerrouille ? "none" : "block";
      document.getElementById("horsPeriode").style.display = isVerrouille ? "block" : "none";
      document.getElementById("txtHorsPeriode").textContent = explication;
    }

    // Mise à jour des cases dans la modale (sauf si le responsable est en train de
    // les modifier : le rafraîchissement automatique n'écrase pas sa saisie)
    const dD = document.getElementById("modalDateDebut"),
      dF = document.getElementById("modalDateFin");
    if (dD && !dD.dataset.modifie && !dF.dataset.modifie) {
      dD.value = dates.debut;
      dF.value = dates.fin;
    }

    // L'offre vient de démarrer (ou démarrage hors période) : charger le cache
    if (!sansCache && !isVerrouille && !cacheVerif && SESSION) rechargerCacheVerif();
  }
  appliquerDates(DATES_INITIALES, true); // tout de suite, sans attendre le serveur

  // fin déjà passée : confirmée d'un second appui sur le bouton (confirme = true)
  function sauvegarderDatesTablette(confirme) {
    const debut = document.getElementById("modalDateDebut").value;
    const fin = document.getElementById("modalDateFin").value;
    const msg = document.getElementById("msgRetourModal");
    const dateFinObj = new Date(fin);
    const dateJour = new Date();
    dateJour.setHours(0, 0, 0, 0);

    if ((debut === "") !== (fin === "")) {
      msg.style.color = "var(--danger)";
      msg.textContent = "Saisissez les deux dates (ou aucune pour arrêter l'opération).";
      return;
    }
    if (debut !== "" && debut > fin) {
      msg.style.color = "var(--danger)";
      msg.textContent = "La date de début doit précéder la date de fin.";
      return;
    }
    if (fin !== "" && dateFinObj < dateJour && confirme !== true) {
      msg.style.color = "var(--danger)";
      msg.textContent = "Date de fin déjà passée : l'offre sera clôturée cette nuit.";
      confirmerEnDeuxTemps(document.getElementById("btnMajDates"), "Confirmer ces dates", function () {
        sauvegarderDatesTablette(true);
      });
      return;
    }

    msg.style.color = "var(--orange)";
    msg.innerHTML = "Mise à jour en cours...";

    appelAdmin(
      "setDatesOperation",
      [debut, fin],
      function (reponse) {
        delete document.getElementById("modalDateDebut").dataset.modifie;
        delete document.getElementById("modalDateFin").dataset.modifie;
        const alerte = (reponse || "").indexOf("⚠️") !== -1;
        msg.style.color = alerte ? "var(--orange)" : "var(--ok)";
        msg.style.whiteSpace = "pre-line";
        msg.textContent = alerte
          ? "Dates mises à jour." + reponse.slice(reponse.indexOf("\n"))
          : "Dates mises à jour.";
        majResumeOperation(debut, fin);
        chargerDatesAffichage();
        setTimeout(
          function () {
            msg.textContent = "";
          },
          alerte ? 15000 : 3000
        );
      },
      function () {
        msg.innerHTML = "";
      }
    );
  }
</script>
