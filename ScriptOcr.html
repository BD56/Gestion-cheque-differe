<!-- ===== SCAN MRZ (OCR) — DORMANT, piloté par OCR_ACTIF ===== -->
<script type="module" data-version="2026.10.15-2028">
  // OCR (lecture de la pièce d'identité) DÉSACTIVÉ par décision de la direction.
  // Repasser ce seul drapeau à true réactive TOUT : bouton 📷, section d'aide,
  // mention légale OCR, et le scan (les librairies ne se chargent qu'au 1er scan).
  const OCR_ACTIF = false;

  const $id = (i) => document.getElementById(i);

  if (OCR_ACTIF) {
    // Révèle les éléments OCR (masqués par défaut dans le HTML)
    ["btnScan", "aideOCR", "mentionOCR"].forEach((id) => {
      const el = $id(id);
      if (el) el.style.display = "";
    });

    const MRZ_LANGPATH =
      "https://raw.githubusercontent.com/DoubangoTelecom/tesseractMRZ/master/tessdata_best";
    const statut = (t) => {
      $id("ocrStatus").textContent = t;
    };

    // Chargement des librairies À LA DEMANDE : rien n'est téléchargé tant qu'on ne scanne pas.
    let _libs = null;
    async function chargerLibs() {
      if (_libs) return _libs;
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      const mrz = await import("https://esm.sh/mrz@3");
      _libs = { Tesseract: window.Tesseract, parse: mrz.parse };
      return _libs;
    }

    $id("btnScan").addEventListener("click", () => $id("ocrFile").click());
    $id("ocrFile").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => lireMRZ(img);
      img.src = URL.createObjectURL(f);
      e.target.value = ""; // autorise un nouveau scan du même fichier
    });

    // Rogne le bas (zone MRZ), agrandit, passe en niveaux de gris
    function prepCanvas(img) {
      const w = img.naturalWidth,
        h = img.naturalHeight;
      const sy = Math.floor(h * 0.62),
        sh = h - sy;
      const scale = Math.min(4, Math.max(1, 1800 / w));
      const c = document.createElement("canvas");
      c.width = Math.round(w * scale);
      c.height = Math.round(sh * scale);
      const ctx = c.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, sy, w, sh, 0, 0, c.width, c.height);
      const im = ctx.getImageData(0, 0, c.width, c.height),
        d = im.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = d[i + 1] = d[i + 2] = g;
      }
      ctx.putImageData(im, 0, 0);
      return c;
    }

    function extraireLignes(t) {
      return t
        .toUpperCase()
        .split("\n")
        .map((l) => l.replace(/ /g, "<").replace(/[^A-Z0-9<]/g, ""))
        .filter((l) => l.length >= 28);
    }
    function ajuster(l, n) {
      return l.length === n ? l : l.length > n ? l.slice(0, n) : l + "<".repeat(n - l.length);
    }
    function tenterParse(parse, lignes) {
      const n = lignes.length,
        der = (k) => lignes.slice(Math.max(0, n - k));
      const essais = [];
      if (n >= 3) essais.push(der(3).map((l) => ajuster(l, 30))); // TD1 (nouvelle CNI / titre de séjour)
      if (n >= 2) {
        essais.push(der(2).map((l) => ajuster(l, 44))); // TD3 (passeport)
        essais.push(der(2).map((l) => ajuster(l, 36)));
      } // ancienne CNI / TD2
      let repli = null;
      for (const e of essais) {
        try {
          const r = parse(e);
          if (r.valid) return r;
          repli = repli || r;
        } catch (_) {}
      }
      return repli;
    }
    function numeroComplet(r) {
      const f = r.fields;
      if (r.format === "FRENCH_NATIONAL_ID")
        return (f.issueDate || "") + (f.administrativeCode2 || "") + (f.documentNumber || "");
      return r.documentNumber || f.documentNumber || "";
    }

    async function lireMRZ(img) {
      $id("btnScan").disabled = true;
      statut("⏳ Chargement du lecteur (1er scan : ~11 Mo, mis en cache ensuite)…");
      try {
        const { Tesseract, parse } = await chargerLibs();
        let worker;
        try {
          worker = await Tesseract.createWorker("mrz", 1, { langPath: MRZ_LANGPATH, gzip: false });
        } catch (_) {
          worker = await Tesseract.createWorker("eng", 1);
        }
        await worker.setParameters({
          tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<",
          tessedit_pageseg_mode: "6",
        });
        statut("🔍 Lecture de la pièce…");
        const { data } = await worker.recognize(prepCanvas(img));
        await worker.terminate();

        const lignes = extraireLignes(data.text);
        const r = lignes.length ? tenterParse(parse, lignes) : null;
        if (r && r.valid) {
          $id("nom").value = r.fields.lastName || "";
          $id("prenom").value = r.fields.firstName || "";
          $id("piece").value = numeroComplet(r);
          statut("✅ Pièce lue — vérifiez les champs, puis saisissez le montant.");
        } else {
          statut(
            "⚠️ Lecture impossible. Reprenez la photo (à plat, nette, MRZ en bas) ou saisissez à la main."
          );
        }
      } catch (e) {
        statut("❌ Erreur lecture : " + e.message);
      } finally {
        $id("btnScan").disabled = false;
      }
    }
  }
</script>
