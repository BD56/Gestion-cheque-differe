<!-- Formulaire : montant, touche Entrée, vérification du N°, copie locale, annuaire. -->
<script data-version="2026.10.15-1659">
  // --- FORMATAGE AUTOMATIQUE DU MONTANT ---
  // Montant lisible -> reformaté « 1234,50 € » ; illisible -> laissé tel quel, encadré en rouge
  ["montant", "corMontant"].forEach(function (idMontant) {
    const champ = document.getElementById(idMontant);
    champ.addEventListener("blur", function () {
      const valeur = this.value.trim();
      if (valeur === "") {
        this.style.borderColor = "";
        return;
      }
      const n = lireMontant(valeur);
      if (n === null) {
        this.style.borderColor = "var(--danger)";
        return;
      }
      this.style.borderColor = "";
      this.value = formaterMontant(n);
    });
    champ.addEventListener("input", function () {
      this.style.borderColor = "";
    });
  });

  // --- ENTRÉE → CHAMP SUIVANT (Nom, Prénom, N° Pièce, Montant ; Notes exclu) ---
  (function () {
    const ordre = ["piece", "nom", "prenom", "montant"];
    ordre.forEach(function (id, i) {
      const champ = document.getElementById(id);
      if (!champ) return;
      champ.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault(); // évite toute soumission implicite du formulaire
        // Champ suivant ; après le dernier (Montant), on cible le bouton Valider
        const suivant =
          i + 1 < ordre.length
            ? document.getElementById(ordre[i + 1])
            : document.getElementById("btnValider");
        if (suivant) suivant.focus();
      });
    });
  })();

  // --- NIVEAU 2 : VÉRIFICATION IMMÉDIATE DU N° DE PIÈCE (au blur) ---
  // Pré-avertissement non bloquant : ce N° est-il déjà sur l'offre en cours ?
  // Cache pré-chargé (offre en cours + annuaire) pour une vérif LOCALE instantanée.
  let cacheVerif = null;
  let seqCache = 0,
    seqCacheApplique = 0;
  // Âge maximum de la copie locale pour décider SANS attendre le serveur. Au-delà
  // (réseau en panne : les rechargements échouent), la tablette attend la réponse
  // du serveur avant d'afficher le résultat.
  let cacheRecuA = 0;
  const AGE_MAX_COPIE_MS = 2 * 60 * 1000;
  function copieFraiche() {
    return !!cacheVerif && Date.now() - cacheRecuA <= AGE_MAX_COPIE_MS;
  }
  // L'annuaire (clients des offres passées, le plus lourd) ne change guère pendant une
  // offre : reçu au démarrage, puis redemandé au plus une fois par heure. Les autres
  // rechargements n'apportent que les saisies de l'offre en cours.
  let annuaireRecuA = 0;
  const AGE_MAX_ANNUAIRE_MS = 60 * 60 * 1000;
  function annuaireARecharger() {
    return !cacheVerif || !cacheVerif.annuaire || Date.now() - annuaireRecuA > AGE_MAX_ANNUAIRE_MS;
  }
  // Copie reçue du serveur : on garde l'annuaire déjà là si elle n'en contient pas
  function appliquerCopie(c) {
    if (c.annuaire === null) {
      c.annuaire = (cacheVerif && cacheVerif.annuaire) || {};
      if (!(cacheVerif && cacheVerif.annuaire)) annuaireRecuA = 0; // à redemander
    } else annuaireRecuA = Date.now();
    cacheVerif = c;
    cacheRecuA = Date.now();
  }
  function rechargerCacheVerif() {
    const seq = ++seqCache;
    dernierRechargementDemande = Date.now();
    const sansAnnuaire = !annuaireARecharger();
    google.script.run
      .withSuccessHandler(function (c) {
        if (seq < seqCacheApplique) return; // réponse plus ancienne qu'une copie déjà appliquée
        seqCacheApplique = seq;
        appliquerCopie(c);
        if (c.config) appliquerConfig(c.config);
        if (c.mode) majPuceMode(c.mode); // mode changé depuis le Sheet ou une autre tablette
        fusionnerEnAttente();
      })
      .withFailureHandler(siNonAutorisee)
      .chargerCacheVerif(SESSION, sansAnnuaire);
  }
  // Rafraîchir au retour sur la page (réveil tablette, retour d'une autre app)
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !SESSION) return;
    if (dansPeriode()) rechargerCacheVerif();
    chargerDatesAffichage(); // la tablette a pu rester ouverte après la fin de l'offre
  });
  setInterval(
    function () {
      if (SESSION) chargerDatesAffichage();
    },
    10 * 60 * 1000
  ); // et sans quitter la page
  // Re-synchroniser au DÉBUT de chaque saisie (focus du N°) : l'appel chevauche la
  // frappe du numéro -> cache frais au moment du blur, sans latence perçue.
  document.getElementById("piece").addEventListener("focus", function () {
    if (SESSION) rechargerCacheVerif();
  });
  // Le curseur peut attendre longtemps dans « N° » entre deux clients : on rafraîchit
  // aussi dès la 1re frappe si la copie a plus de 20 s (fraîche à la validation).
  let dernierRechargementDemande = 0;
  document.getElementById("piece").addEventListener("input", function () {
    if (!SESSION || !dansPeriode()) return;
    const t = Date.now();
    if (t - cacheRecuA > 20000 && t - dernierRechargementDemande > 5000) rechargerCacheVerif();
  });

  // Comparaison des noms (miroir de Detection.gs::_normId_) : majuscules, sans accents,
  // ligatures dépliées, sans espaces, tirets, apostrophes ni points.
  const SEPARATEURS_NOM_JS = /[\s\-\u2010-\u2015\u2212'’‘ʼ`´′.,_/\u200B-\u200D\uFEFF]/g;
  function normIdJS(p) {
    if (p === null || p === undefined) return "";
    return p
      .toString()
      .toUpperCase()
      .replace(/Œ/g, "OE")
      .replace(/Æ/g, "AE")
      .replace(/Ø/g, "O")
      .replace(/Ł/g, "L")
      .replace(/Đ/g, "D")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(SEPARATEURS_NOM_JS, "");
  }
  // Comparaison des N° de pièce (miroir de Detection.gs::_normPiece_) : majuscules, lettres
  // et chiffres seulement ; N° entièrement numérique sans ses 0 initiaux (Sheets a pu
  // stocker "0123" en 123).
  function normPieceJS(p) {
    if (p === null || p === undefined) return "";
    const n = p
      .toString()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Z0-9]/g, "");
    return /^\d+$/.test(n) ? n.replace(/^0+(?=\d)/, "") : n;
  }
  // #16 : toute donnée (nom, notes…) insérée dans du HTML passe par echapper()
  function echapper(v) {
    return (v === null || v === undefined ? "" : v)
      .toString()
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  document.getElementById("piece").addEventListener("blur", function () {
    const champ = this,
      val = this.value.trim();
    const pn = normPieceJS(val);
    if (pn === "") return; // champ vide (ou sans lettre ni chiffre) -> rien
    if (!copieFraiche()) {
      // copie absente ou trop ancienne -> repli serveur (rare)
      google.script.run
        .withSuccessHandler(function (res) {
          if (champ.value.trim() === val) afficherVerifPiece(res); // pas pour un N° déjà retapé
        })
        .withFailureHandler(siNonAutorisee)
        .verifierPiece(val, SESSION);
      return;
    }
    // Vérif 100% locale (instantanée)
    const matches = cacheVerif.offre.filter(function (d) {
      return d.pieceNorm === pn;
    });
    if (matches.length) {
      afficherVerifPiece({ trouve: true, mode: cacheVerif.mode, matches: matches });
    } else if (cacheVerif.annuaireActif && cacheVerif.annuaire[pn]) {
      afficherVerifPiece({
        trouve: false,
        annuaire: cacheVerif.annuaire[pn],
        modeAnnuaire: cacheVerif.modeAnnuaire,
      });
    } else {
      afficherVerifPiece({ trouve: false });
    }
  });

  // Verdict sous le N° : effacé dès que le numéro change
  function masquerVerdict() {
    const v = document.getElementById("verdictPiece");
    v.style.display = "none";
    v.innerHTML = "";
  }
  function afficherVerdict(classe, icone, html) {
    const v = document.getElementById("verdictPiece");
    v.className = "verdict " + classe;
    v.innerHTML = '<svg class="ico"><use href="#i-' + icone + '"/></svg>' + html;
    v.style.display = "block";
  }
  document.getElementById("piece").addEventListener("input", masquerVerdict);

  // Étapes 1-2-3 : le numéro passe au vert quand ses champs obligatoires sont remplis
  function majEtapes() {
    const plein = function (id) {
      return document.getElementById(id).value.trim() !== "";
    };
    document.getElementById("num1").classList.toggle("fait", plein("piece"));
    document.getElementById("num2").classList.toggle("fait", plein("nom") && plein("prenom"));
    document.getElementById("num3").classList.toggle("fait", !MONTANT_OBLIGATOIRE || plein("montant"));
  }
  ["piece", "nom", "prenom", "montant", "notes"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", majEtapes);
  });
  majEtapes();

  function afficherVerifPiece(res) {
    if (!res) return;
    if (res.trouve) {
      // Niveau 2 : doublon sur l'offre en cours -> message sous le N° (la décision se fait à la validation)
      const max = passagesMaxJS(),
        nb = (res.matches || []).length;
      let msg,
        classe = "ko";
      if (max === 1) {
        msg = "Ce numéro est déjà enregistré sur cette offre.";
        if (res.mode === "BLOQUANT") msg += " (sera refusé à la validation)";
      } else if (nb < max) {
        classe = "info";
        msg =
          "Ce numéro est déjà enregistré " +
          nb +
          " fois sur cette offre. Jusqu'à " +
          max +
          " passages par client sont autorisés : vérifiez le nom sur la pièce.";
      } else {
        msg =
          "Ce numéro est déjà enregistré " +
          nb +
          " fois sur cette offre : limite de " +
          max +
          " passages atteinte" +
          (res.mode === "BLOQUANT" ? " (sera refusé à la validation)." : ".");
      }
      let html = echapper(msg) + "<ul>";
      (res.matches || []).forEach(function (d) {
        html += "<li>" + echapper(d.nom) + " " + echapper(d.prenom) + " · " + echapper(d.date);
        if (d.montant !== "") html += " · " + echapper(formaterMontantAffiche(d.montant));
        html += "</li>";
      });
      afficherVerdict(classe, "alerte", html + "</ul>");
      // Pas de pré-remplissage ici : l'hôtesse doit recopier le nom LU sur la pièce
      // présentée. Pré-remplir avec le nom déjà enregistré transformait une usurpation
      // (même pièce, autre personne = cas B) en « vrai doublon » A si elle ne corrigeait pas.
      return;
    }
    afficherVerdict("ok", "check", "Numéro pas encore enregistré sur cette offre.");
    // Niveau 3 (annuaire) : pièce connue d'une offre passée, pas sur l'offre en cours
    if (res.annuaire) {
      if (res.modeAnnuaire === "B") proposerAnnuaire(res.annuaire);
      else remplirAnnuaire(res.annuaire); // 'C' = pré-remplissage doux (défaut)
    }
  }

  // --- NIVEAU 3 : auto-complétion depuis l'annuaire inter-offres ---
  // Option C : pré-remplissage doux (remplit si vide + indice discret).
  function remplirAnnuaire(a) {
    const n = document.getElementById("nom"),
      p = document.getElementById("prenom");
    [
      [n, a.nom],
      [p, a.prenom],
    ].forEach(function (x) {
      if (x[0].value.trim() !== "" || !x[1]) return;
      x[0].value = x[1];
      x[0].dataset.prerempli = "1"; // taper dans le champ REMPLACE le texte proposé
      if (document.activeElement === x[0]) x[0].select();
    });
    const ind = document.getElementById("indiceAnnuaire");
    if (ind) ind.style.display = "block";
  }
  // Champ pré-rempli : sélectionné à l'arrivée, la frappe remplace (et ne s'ajoute pas :
  // sinon « DUPONT » + « DUPONT » tapé = « DUPONTDUPONT »).
  ["nom", "prenom"].forEach(function (id) {
    const champ = document.getElementById(id);
    champ.addEventListener("focus", function () {
      if (!champ.dataset.prerempli) return;
      champ.select(); // tout de suite (frappe rapide) et après le toucher (sinon désélectionné)
      setTimeout(function () {
        if (document.activeElement === champ && champ.dataset.prerempli) champ.select();
      }, 0);
    });
    champ.addEventListener("input", function () {
      delete champ.dataset.prerempli;
    });
  });
  // Option B : modale qui demande la confirmation.
  function proposerAnnuaire(a) {
    const m = document.getElementById("modalAnnuaire");
    m.dataset.nom = a.nom || "";
    m.dataset.prenom = a.prenom || "";
    document.getElementById("msgAnnuaire").innerHTML =
      "Client connu d'une offre précédente : <b>" +
      echapper(a.nom) +
      " " +
      echapper(a.prenom) +
      "</b>.<br>Pré-remplir le Nom et le Prénom ?";
    m.style.display = "flex";
  }
  function utiliserAnnuaire() {
    const m = document.getElementById("modalAnnuaire");
    remplirAnnuaire({ nom: m.dataset.nom, prenom: m.dataset.prenom });
    m.style.display = "none";
  }
  function ignorerAnnuaire() {
    document.getElementById("modalAnnuaire").style.display = "none";
  }

  // Réglage B/C dans le Panneau (visible seulement si l'annuaire est actif)
  function majAffichageModeAnnuaire(mode) {
    const btn = document.getElementById("btnModeAnnuaire");
    document.getElementById("blocAnnuaire").style.display = "flex";
    btn.textContent =
      "Pré-remplissage des anciens clients : " + (mode === "B" ? "demander d'abord" : "automatique");
  }
  let modeAnnuaireEnCours = false;
  function changerModeAnnuaire() {
    if (modeAnnuaireEnCours) return;
    const btn = document.getElementById("btnModeAnnuaire"),
      avant = btn.innerHTML;
    modeAnnuaireEnCours = true;
    btn.textContent = "Mise à jour…";
    appelAdmin(
      "basculerModeAnnuaire",
      [],
      function (mode) {
        modeAnnuaireEnCours = false;
        majAffichageModeAnnuaire(mode);
        if (cacheVerif) cacheVerif.modeAnnuaire = mode;
      },
      function () {
        modeAnnuaireEnCours = false;
        btn.innerHTML = avant;
      }
    );
  }
</script>
