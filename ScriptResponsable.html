<!-- Espace responsable : code, corrections, archives, réglages, comptes. -->
<script data-version="2026.10.18-0103">
  // =================================================================
  // --- ESPACE RESPONSABLE (code PIN) ---
  // Le jeton n'est gardé qu'en mémoire : il disparaît à la fermeture du
  // panneau, au rechargement de la page, ou après 10 min d'inactivité
  // (côté serveur). Chaque action protégée le renvoie au serveur.
  // =================================================================
  let jetonAdmin = null;
  let pinDefini = true;
  let codePersonnel = false; // codes personnels : un code par personne (Personnes.gs)
  let personneAdmin = ""; // qui a ouvert l'espace (codes personnels)

  // Appel d'une fonction serveur protégée (le jeton est ajouté en dernier argument)
  function appelAdmin(nomFonction, args, onOk, onErr) {
    const runner = google.script.run.withSuccessHandler(onOk).withFailureHandler(function (err) {
      const m = err && err.message ? err.message : String(err);
      if (onErr) onErr(err);
      if (m.indexOf("ADMIN_REQUIS") !== -1) {
        verrouillerAdmin();
        afficherZoneVerrou("Session expirée : ressaisissez le code.");
      } else {
        afficherToast("Erreur : " + m, "error");
      }
    });
    // codes ou personnes changés : l'état du verrou gardé en mémoire ne vaut plus
    if (
      ["definirPin", "passerCodesPersonnels", "ajouterPersonne", "retirerPersonne"].indexOf(nomFonction) !==
      -1
    )
      oublierEtatVerrou();
    // jeton lié à cette tablette : il est envoyé avec sa clé
    runner[nomFonction].apply(runner, args.concat([{ j: jetonAdmin, c: SESSION }]));
  }

  // --- Listes de l'espace responsable (saisies, archives, comptes) ---
  // Préparées avant le code (aperçu, plus bas) puis rechargées dès le déverrouillage : à
  // l'ouverture d'un écran, la liste déjà reçue s'affiche tout de suite puis est
  // rechargée (état le plus récent).
  // Effacées au verrouillage (noms, N° de pièce).
  let listesAdmin = {};
  // forcer : après une modification, nouvel appel même si un autre est en route (sa
  // réponse, partie avant la modification, serait ancienne) ; seule la dernière compte.
  function lireListeAdmin(fonction, surListe, forcer) {
    const l =
      listesAdmin[fonction] ||
      (listesAdmin[fonction] = { donnees: null, enCours: false, attente: [], seq: 0 });
    if (surListe) l.attente.push(surListe);
    if (l.enCours && !forcer) return; // déjà demandée (préchargement en route) : pas de second appel
    l.enCours = true;
    const seq = ++l.seq;
    appelAdmin(
      fonction,
      [],
      function (donnees) {
        if (seq !== l.seq) return; // une demande plus récente est en route : elle répondra
        l.enCours = false;
        if (!jetonAdmin || listesAdmin[fonction] !== l) return; // verrouillé entre-temps
        l.donnees = donnees || [];
        const a = l.attente;
        l.attente = [];
        a.forEach(function (f) {
          f(l.donnees);
        });
      },
      function () {
        if (seq !== l.seq) return;
        l.enCours = false;
        l.attente = [];
      }
    );
  }
  // À l'ouverture d'un écran : liste déjà reçue tout de suite (provisoire = true), puis
  // la liste rechargée — ou attente du préchargement s'il est encore en route.
  function afficherListeAdmin(fonction, dessiner) {
    const l = listesAdmin[fonction];
    if (l && l.donnees) dessiner(l.donnees, true);
    lireListeAdmin(fonction, function (d) {
      dessiner(d, false);
    });
  }
  function prechargerListesAdmin() {
    ["listerSaisies", "listerArchives", "listerComptes"].forEach(function (f) {
      lireListeAdmin(f);
    });
  }

  // --- Aperçu : préparé à l'appui sur ⚙️, pendant que le code est tapé ---
  // Lectures qu'un compte connecté obtient déjà sans code (saisies, chiffres, réglages,
  // noms des archives, comptes) : rien n'est affiché avant que le serveur accepte le
  // code ; ensuite tout apparaît aussitôt, puis est rechargé. Oublié à la fermeture.
  let apercuAdmin = null,
    seqApercu = 0;
  function preparerApercuAdmin() {
    apercuAdmin = null;
    const seq = ++seqApercu;
    google.script.run
      .withSuccessHandler(function (a) {
        if (seq === seqApercu && !jetonAdmin) apercuAdmin = a; // arrivé après le code : inutile
      })
      .withFailureHandler(function () {})
      .apercuResponsable(SESSION);
  }
  function oublierApercuAdmin() {
    apercuAdmin = null;
    seqApercu++;
  }
  // Au déverrouillage : écrans remplis avec l'aperçu, avant les réponses à jour
  function utiliserApercuAdmin() {
    const a = apercuAdmin;
    oublierApercuAdmin();
    if (!a) return;
    [
      ["listerSaisies", a.saisies],
      ["listerArchives", a.archives],
      ["listerComptes", a.comptes],
    ].forEach(function (p) {
      listesAdmin[p[0]] = { donnees: p[1] || [], enCours: false, attente: [], seq: 0 };
    });
    appliquerInfosAdmin(a, true);
  }

  // Verrou : dernier état connu (code ? codes personnels ? noms), gardé en mémoire depuis
  // la connexion. ⚙️ affiche aussitôt le bon écran avec lui, puis le serveur confirme en
  // UNE question (etatVerrou) ; s'il a changé, l'écran est corrigé. Sans état connu :
  // « Chargement… », rien de faux (ni champ de code avant de savoir s'il faut un nom).
  let etatVerrouConnu = null;
  function lireEtatVerrou(suite) {
    google.script.run
      .withSuccessHandler(function (etat) {
        etatVerrouConnu = etat;
        if (suite) suite(etat);
      })
      .withFailureHandler(function (err) {
        if (suite && !siNonAutorisee(err) && !etatVerrouConnu)
          document.getElementById("txtVerrou").textContent = "Serveur injoignable : vérifiez le Wi-Fi.";
      })
      .etatVerrou(SESSION);
  }
  // Codes ou personnes changés depuis cet appareil : l'état gardé ne vaut plus
  function oublierEtatVerrou() {
    etatVerrouConnu = null;
  }
  function memeEtatVerrou(a, b) {
    return !!a && !!b && JSON.stringify(a) === JSON.stringify(b);
  }

  function afficherZoneVerrou(message) {
    document.getElementById("zoneAdmin").style.display = "none";
    document.getElementById("railAdmin").style.display = "none";
    document.getElementById("zoneVerrou").style.display = ""; // grille de .verrou (centre la carte)
    document.getElementById("adminSous").textContent = "Code responsable demandé";
    document.getElementById("contenuAdmin").classList.add("verrouille");
    allerEcran(null); // rien sous le code : imprimer la journée se fait dans le journal
    preparerApercuAdmin();
    document.getElementById("msgVerrou").textContent = message || "";
    document.getElementById("compteVerrou").textContent = COMPTE ? "Connecté : " + COMPTE + " ·" : "";
    const montre = etatVerrouConnu;
    if (montre) appliquerEtatVerrou(montre);
    else attendreEtatVerrou();
    lireEtatVerrou(function (etat) {
      if (document.getElementById("zoneVerrou").style.display === "none") return; // déjà ouvert / fermé
      if (!memeEtatVerrou(montre, etat)) appliquerEtatVerrou(etat);
    });
  }
  function attendreEtatVerrou() {
    document.getElementById("txtVerrou").textContent = "Chargement…";
    ["personneVerrou", "pinSaisi", "btnDeverrouiller"].forEach(function (id) {
      document.getElementById(id).style.display = "none";
    });
  }
  function appliquerEtatVerrou(etat) {
    pinDefini = etat.pinDefini;
    codePersonnel = !!etat.codePersonnel;
    // Pas encore de code (obligatoire) : le choisir d'abord, puis l'espace s'ouvre
    if (!pinDefini) {
      afficherChoixCode(true);
      return;
    }
    // un code a été choisi entre-temps (autre appareil) : le choix affiché d'après l'état
    // gardé se referme
    if (choixCodeDepuisEspace && document.getElementById("blocCodeAPart").style.display !== "none")
      document.getElementById("ecranConnexion").style.display = "none";
    document.getElementById("txtVerrou").textContent = codePersonnel
      ? "Choisissez votre nom, puis tapez votre code."
      : "Saisissez le code responsable.";
    document.getElementById("pinSaisi").style.display = "";
    document.getElementById("btnDeverrouiller").style.display = "";
    const choix = document.getElementById("personneVerrou");
    choix.style.display = codePersonnel ? "" : "none";
    if (codePersonnel) remplirPersonnesVerrou(etat.personnes || []);
  }

  // « Qui êtes-vous ? » : noms des personnes (le nom déjà choisi, sinon le dernier choisi
  // sur cet appareil)
  function remplirPersonnesVerrou(liste) {
    const choix = document.getElementById("personneVerrou");
    const garde = choix.value || lireStockage("cdPersonne");
    choix.textContent = "";
    const vide = document.createElement("option");
    vide.value = "";
    vide.textContent = "Qui êtes-vous ?";
    choix.appendChild(vide);
    liste.forEach(function (p) {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.nom;
      choix.appendChild(o);
    });
    if (
      garde &&
      liste.some(function (p) {
        return p.id === garde;
      })
    )
      choix.value = garde;
  }

  function deverrouillerAdmin() {
    if (document.getElementById("btnDeverrouiller").disabled) return; // pause après un code faux
    const pin = document.getElementById("pinSaisi").value.trim();
    const msg = document.getElementById("msgVerrou");
    msg.textContent = "";
    const idPersonne = codePersonnel ? document.getElementById("personneVerrou").value : "";
    if (codePersonnel && !idPersonne) {
      msg.textContent = "Choisissez votre nom.";
      return;
    }
    if (!/^\d{6}$/.test(pin)) {
      msg.textContent = "Le code doit contenir exactement 6 chiffres.";
      return;
    }
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById("pinSaisi").value = "";
        if (r && r.ok) {
          jetonAdmin = r.jeton;
          personneAdmin = r.personne || "";
          if (idPersonne) ecrireStockage("cdPersonne", idPersonne);
          afficherZoneAdmin();
        } else if (r && r.codeACreer) {
          pinDefini = false; // code réinitialisé entre-temps dans le Sheet
          afficherChoixCode(true);
        } else {
          msg.textContent = (r && r.message) || "Refusé.";
          if (r) pauseBouton(document.getElementById("btnDeverrouiller"), r.pauseMs);
        }
      })
      .withFailureHandler(function (err) {
        if (!siNonAutorisee(err)) msg.textContent = "Erreur : " + (err && err.message ? err.message : err);
      })
      .ouvrirSessionAdmin(pin, SESSION, idPersonne);
  }

  function verrouillerAdmin() {
    if (jetonAdmin) google.script.run.withFailureHandler(function () {}).fermerSessionAdmin(jetonAdmin);
    jetonAdmin = null;
    personneAdmin = "";
    changementsDeplies = false;
    saisieEnCours = null;
    listesAdmin = {};
    oublierApercuAdmin();
    listeSaisies = [];
    document.getElementById("listeSaisies").textContent = "";
    document.getElementById("listeComptes").textContent = "";
    document.getElementById("selArchive").textContent = "";
    // rien d'une session ne survit à la suivante : réglages rechargés, dates relues
    reglagesCharges = false;
    reglagesModifies = false;
    document.getElementById("champsReglages").innerHTML = "";
    delete document.getElementById("modalDateDebut").dataset.modifie;
    delete document.getElementById("modalDateFin").dataset.modifie;
    annulerCloture();
    document.getElementById("zoneAdmin").style.display = "none";
    document.getElementById("railAdmin").style.display = "none";
    document.getElementById("zoneVerrou").style.display = ""; // grille de .verrou (centre la carte)
    allerEcran(null);
    document.getElementById("contenuAdmin").classList.add("verrouille");
    if (document.getElementById("modalParametres").style.display === "flex") afficherZoneVerrou();
  }

  function afficherZoneAdmin() {
    document.getElementById("zoneVerrou").style.display = "none";
    document.getElementById("zoneAdmin").style.display = "block";
    document.getElementById("railAdmin").style.display = "flex";
    document.getElementById("contenuAdmin").classList.remove("verrouille");
    majCodeAPart();
    allerEcran("ensemble");
    utiliserApercuAdmin();
    rafraichirEnsemble(true);
    prechargerListesAdmin();
  }
  // Vue d'ensemble : chiffres, dates, mode et alertes, relus sur le serveur (« Saisies »
  // fait foi). Au déverrouillage, les réglages sont aussi chargés dans leur formulaire.
  function rafraichirEnsemble(avecReglages) {
    appelAdmin("getInfosAdmin", [], function (infos) {
      appliquerInfosAdmin(infos, avecReglages);
    });
  }
  function appliquerInfosAdmin(infos, avecReglages) {
    majAffichageMode(infos.mode);
    if (infos.annuaireActif) majAffichageModeAnnuaire(infos.modeAnnuaire);
    const dD = document.getElementById("modalDateDebut"),
      dF = document.getElementById("modalDateFin");
    if (!dD.dataset.modifie && !dF.dataset.modifie) {
      dD.value = infos.dates.debut;
      dF.value = infos.dates.fin;
    }
    majResumeOperation(infos.dates.debut, infos.dates.fin);
    majChiffres(infos.chiffres);
    // formulaire déjà rempli par l'aperçu et modifié depuis : la saisie est gardée
    if (avecReglages && !reglagesModifies) remplirFormulaireReglages(infos.config);
    if (infos.robots) afficherAlertesAdmin(infos); // pas dans l'aperçu (avant le code)
    if (infos.changements) afficherChangements(infos.changements);
  }
  // Changements récents de « qui peut faire quoi » : visibles de tous 2 jours (serveur).
  // En bas de la vue d'ensemble, replié sur une ligne (nombre + le dernier) ; « Voir
  // tout » déplie la liste (5 au plus). Choix de Bryan (17/10, option A compacte).
  let changementsDeplies = false;
  function afficherChangements(c) {
    const total = c.lignes.length + (c.autres || 0);
    document.getElementById("changementsRecents").style.display = total ? "" : "none";
    if (!total) return;
    document.getElementById("nbChangements").textContent =
      total > 1 ? total + " changements des accès depuis 2 jours" : "1 changement des accès depuis 2 jours";
    document.getElementById("dernierChangement").textContent =
      (total > 1 ? "· dernier : " : "· ") + c.lignes[0];
    const ul = document.getElementById("listeChangements");
    ul.textContent = "";
    c.lignes.forEach(function (t) {
      const li = document.createElement("li");
      li.textContent = t;
      ul.appendChild(li);
    });
    document.getElementById("noteChangements").textContent =
      (c.autres ? "Et " + c.autres + " autre(s) : voir le journal du Google Sheets. " : "") +
      "Visibles de toute l'équipe pendant 2 jours ; tout reste dans le journal du Google Sheets.";
    // un seul changement : la ligne dit déjà tout
    document.getElementById("btnVoirChangements").style.display = total > 1 ? "" : "none";
    majDeplieChangements(total > 1 && changementsDeplies);
  }
  function majDeplieChangements(ouvert) {
    document.getElementById("detailChangements").style.display = ouvert ? "" : "none";
    const b = document.getElementById("btnVoirChangements");
    b.setAttribute("aria-expanded", String(ouvert));
    b.textContent = ouvert ? "Replier ▴" : "Voir tout ▾";
  }
  function basculerChangements() {
    changementsDeplies = !changementsDeplies;
    majDeplieChangements(changementsDeplies);
  }
  function ouvrirEnsemble() {
    allerEcran("ensemble");
    rafraichirEnsemble(false);
  }
  function majChiffres(c) {
    if (!c) return;
    document.getElementById("kpiSaisies").textContent = c.saisies;
    document.getElementById("kpiTotal").textContent = formaterTotal(c.total);
    document.getElementById("kpiForcees").textContent = c.forcees;
    document.getElementById("kpiForcees").parentNode.classList.toggle("non-nul", c.forcees > 0);
    // codes personnels : nombre de personnes ; code commun : « commun »
    document.getElementById("kpiResponsables").textContent = c.responsables || "commun";
    document.getElementById("railNbSaisies").textContent = c.saisies;
  }

  // Points d'attention en tête de l'espace responsable : journal modifié à la main,
  // robot de nuit absent ou arrêté.
  function afficherAlertesAdmin(infos) {
    const lignes = [],
      r = infos.robots || {};
    if (infos.alerteJournal)
      lignes.push(
        "Journal des actions modifié à la main dans le Google Sheets (" +
          infos.alerteJournal.texte +
          " ; constaté le " +
          infos.alerteJournal.constatee +
          "). À vérifier par la direction (Google Sheets → Fichier → Historique des versions), puis à marquer comme vu dans le panneau du Sheet."
      );
    if (!r.cloture || !r.purge) {
      lignes.push(
        "Robot de nuit absent : la clôture automatique et la suppression des données anciennes ne se feront pas. Ouvrez le Google Sheets → menu 🚀 APPLICATION → 🧰 Installer."
      );
    } else if (r.derniereNuitMs && Date.now() - r.derniereNuitMs > 36 * 3600000) {
      lignes.push(
        "Le robot de nuit n'a pas fonctionné depuis le " +
          r.derniereNuit +
          ". Ouvrez le Google Sheets → menu 🚀 APPLICATION → 🧰 Installer (et acceptez les autorisations)."
      );
    }
    const z = document.getElementById("alerteAdmin");
    z.textContent = "";
    lignes.forEach(function (t) {
      const d = document.createElement("div");
      d.textContent = t;
      z.appendChild(d);
    });
    z.style.display = lignes.length ? "block" : "none";
  }

  // Navigation : une vue à la fois ; le menu de gauche montre la vue active
  function allerEcran(nom) {
    const ecrans = document.querySelectorAll("#modalParametres .sous-ecran");
    for (let i = 0; i < ecrans.length; i++)
      ecrans[i].classList.toggle("actif", ecrans[i].getAttribute("data-ecran") === nom);
    const liens = document.querySelectorAll("#railAdmin [data-ecran-lien]");
    for (let i = 0; i < liens.length; i++)
      liens[i].setAttribute("aria-current", String(liens[i].getAttribute("data-ecran-lien") === nom));
    if (nom !== "saisies") saisieEnCours = null; // une correction laissée en plan est abandonnée
    // menu horizontal (écran étroit) : l'entrée active reste visible
    const actif = document.querySelector('#railAdmin [aria-current="true"]');
    if (actif && actif.scrollIntoView) actif.scrollIntoView({ block: "nearest", inline: "nearest" });
    document.getElementById("contenuAdmin").scrollTop = 0;
  }
  // Résumé de l'offre (vue d'ensemble et écran Opération) : dates, avancement,
  // clôture automatique
  function majResumeOperation(debut, fin) {
    let resume = "Aucune date",
      note = "Saisissez les dates de l'offre dans « Opération ».",
      largeur = "0";
    if (debut && fin) {
      resume = "Du " + formaterDateAffichage(debut) + " au " + formaterDateAffichage(fin);
      const j = new Date();
      j.setHours(0, 0, 0, 0);
      const d = new Date(debut),
        f = new Date(fin);
      d.setHours(0, 0, 0, 0);
      f.setHours(0, 0, 0, 0);
      const total = Math.round((f - d) / 86400000) + 1,
        jour = Math.round((j - d) / 86400000) + 1;
      const lendemain = new Date(f.getTime() + 86400000);
      const nuit =
        "clôture automatique dans la nuit du " +
        formaterDateAffichage(fin) +
        " au " +
        ("0" + lendemain.getDate()).slice(-2) +
        "/" +
        ("0" + (lendemain.getMonth() + 1)).slice(-2) +
        ".";
      if (jour < 1) note = "Commence dans " + (1 - jour) + " jour(s) · " + nuit;
      else if (jour > total) {
        note = "Terminée : archivage cette nuit.";
        largeur = "100%";
      } else {
        note = "Jour " + jour + " sur " + total + " · " + nuit;
        largeur = Math.round((jour / total) * 100) + "%";
      }
    }
    document.querySelectorAll("#modalParametres .resume-offre").forEach(function (e) {
      e.textContent = resume;
    });
    document.querySelectorAll("#modalParametres .note-offre").forEach(function (e) {
      e.textContent = note;
    });
    document.querySelectorAll("#modalParametres .barre-offre").forEach(function (e) {
      e.style.width = largeur;
    });
  }

  // Bouton à confirmer d'un second appui (dans les 5 s) : suppression, retrait…
  function confirmerEnDeuxTemps(btn, texteConfirmation, action) {
    if (btn.dataset.confirmer) {
      clearTimeout(Number(btn.dataset.minuteur));
      delete btn.dataset.confirmer;
      btn.innerHTML = btn.dataset.avant;
      btn.classList.remove("a-confirmer");
      action();
      return;
    }
    btn.dataset.avant = btn.innerHTML;
    btn.dataset.confirmer = "1";
    btn.textContent = texteConfirmation;
    btn.classList.add("a-confirmer");
    btn.dataset.minuteur = setTimeout(function () {
      delete btn.dataset.confirmer;
      btn.innerHTML = btn.dataset.avant;
      btn.classList.remove("a-confirmer");
    }, 5000);
  }

  // --- Correction / suppression d'une saisie ---
  // Le serveur recontrôle A/B/C sur « Saisies » (source de vérité) à chaque correction.
  let listeSaisies = [],
    saisieEnCours = null;

  function ouvrirSaisies() {
    allerEcran("saisies");
    afficherVueListe();
    chargerListeSaisies();
  }
  function afficherVueListe() {
    document.getElementById("vueCorrection").style.display = "none";
    document.getElementById("vueListeSaisies").style.display = "block";
  }
  function msgSaisies(texte, couleur) {
    const m = document.getElementById("msgSaisies");
    m.textContent = sansPicto(texte || "");
    m.style.color = couleur || "var(--encre)";
  }
  // message : résultat d'une correction / suppression à afficher au-dessus de la liste
  function chargerListeSaisies(message, couleur) {
    msgSaisies(message || "Chargement…", couleur);
    const dessiner = function (liste, provisoire) {
      listeSaisies = liste;
      const nombre = liste.length ? liste.length + " saisie(s)" : "Aucune saisie sur l'offre en cours.";
      msgSaisies(message || nombre + (provisoire ? " · mise à jour…" : ""), couleur);
      dessinerListeSaisies();
    };
    if (message)
      lireListeAdmin("listerSaisies", dessiner, true); // après une modification : liste fraîche
    else afficherListeAdmin("listerSaisies", dessiner);
  }
  function dessinerListeSaisies() {
    const saisi = document.getElementById("rechercheSaisie").value;
    const filtre = normIdJS(saisi),
      filtrePiece = normPieceJS(saisi);
    const zone = document.getElementById("listeSaisies");
    zone.innerHTML = "";
    const el = function (balise, classe, texte) {
      const e = document.createElement(balise);
      if (classe) e.className = classe;
      if (texte !== undefined) e.textContent = texte;
      return e;
    };
    listeSaisies.forEach(function (sa) {
      const botte = normIdJS(sa.nom + sa.prenom + " " + sa.prenom + sa.nom + " " + sa.piece);
      if (filtre && botte.indexOf(filtre) === -1 && botte.indexOf(filtrePiece) === -1) return;
      const ligne = el("div", "ligne-saisie" + (sa.alerte ? " forcee" : ""));

      qui.appendChild(el("small", "piece", sa.piece));

      const montant = el("div", "mt", sa.montant ? formaterMontantAffiche(sa.montant) : "");
      const actions = el("div", "actions");
      const bCor = el("button", "sec", "Corriger");

        corrigerUneSaisie(sa);
      });

      });

    });

  function enregistrerCorrection(forcer) {
    if (!saisieEnCours) return;
    const montantCor = document.getElementById("corMontant").value.trim();
    if (montantCor !== "" && lireMontant(montantCor) === null) {
      remplirTeteAlerte("corTete", "corAlerteCas", "corAlerteTitre", {}, "Montant illisible");
      document.getElementById("corAlerteMsg").textContent = "Saisissez un nombre (ex. 150 ou 150,50).";
      document.getElementById("corAlerteListe").textContent = "";
      document.getElementById("btnForcerCorrection").style.display = "none";
      document.getElementById("corAlerte").style.display = "block";
      return;
    }
    const nouveau = {
      piece: document.getElementById("corPiece").value,
      nom: document.getElementById("corNom").value,
      prenom: document.getElementById("corPrenom").value,
      montant: montantCor === "" ? "" : formaterMontant(lireMontant(montantCor)),
      notes: document.getElementById("corNotes").value,
    };
    appelAdmin(
      "modifierSaisie",
      [saisieEnCours.ligne, attenduDe(saisieEnCours), nouveau, !!forcer],
      function (r) {
        if (r.status === "SUCCES") {
          saisieEnCours = null;
          afficherVueListe();
          chargerListeSaisies(r.message, r.message.indexOf("✅") === 0 ? "var(--ok)" : "var(--orange)");
          rechargerCacheVerif();
          return;
        }
        // Doublon : CONFIRMATION (forçable) ou BLOQUE -> même comparaison qu'à la saisie
        remplirTeteAlerte("corTete", "corAlerteCas", "corAlerteTitre", r, sansPicto(r.titre));
        document.getElementById("corAlerteMsg").textContent = r.message;
        document.getElementById("corAlerteListe").innerHTML = tableauxComparaison(nouveau, r.details);
        document.getElementById("btnForcerCorrection").style.display =
          r.status === "CONFIRMATION" ? "inline-block" : "none";
        document.getElementById("corAlerte").style.display = "block";
      },
      function (err) {
        // Ligne qui a bougé, champ manquant… : on revient à la liste rechargée
        const m = err && err.message ? err.message : "";
        if (m.indexOf("ADMIN_REQUIS") === -1 && m.indexOf("rechargez") !== -1) {
          saisieEnCours = null;
          afficherVueListe();
          chargerListeSaisies();
        }
      }
    );
  }

  // « Du 01/12 au 24/12/2025 · 342 saisies · 51 230 € » (résumé gardé par le serveur)
  function texteResumeArchive(a) {
    const jour = function (d) {
      const p = (d || "").split("-");
      return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : d;
    };
    let quand = a.libelle;
    if (a.debut && a.fin)
      quand =
        a.debut === a.fin
          ? "Le " + jour(a.debut)
          : "Du " +
            (a.debut.slice(0, 4) === a.fin.slice(0, 4) ? formaterDateAffichage(a.debut) : jour(a.debut)) +
            " au " +
            jour(a.fin);
    return (
      quand + " · " + a.saisies + (a.saisies > 1 ? " saisies" : " saisie") + " · " + formaterTotal(a.total)
    );
  }

  // Champs d'un formulaire de code : 6 chiffres, deux fois. Renvoie le code ou "" (message).
  function lireCodeDouble(id1, id2, msg) {
    const c1 = document.getElementById(id1).value.trim();
    msg.style.color = "var(--danger)";
    if (!/^\d{6}$/.test(c1)) {
      msg.textContent = "Le code doit contenir exactement 6 chiffres.";
      return "";
    }
    if (c1 !== document.getElementById(id2).value.trim()) {
      msg.textContent = "Les deux codes ne correspondent pas.";
      return "";
    }
    return c1;
  }

  function estMonCompte(c) {
    return normIdJS(c.identifiant) === normIdJS(COMPTE);
  }
  function ligneCompte(c, retirable) {
    const bloc = document.createElement("div");
    const ligne = document.createElement("div");
    ligne.className = "ligne-compte";
    const texte = document.createElement("div");
    const nom = document.createElement("b");
    nom.textContent = c.identifiant + (estMonCompte(c) ? " (vous)" : "");
    const quand = document.createElement("small");
    quand.textContent = "Créé le " + c.creeLe + (c.vueLe ? " · utilisé le " + c.vueLe : "");
    texte.appendChild(nom);
    texte.appendChild(quand);
    const actions = document.createElement("div");
    actions.className = "actions-compte";
    const bMdp = document.createElement("button");
    bMdp.className = "sec";
    bMdp.textContent = "Mot de passe";
    actions.appendChild(bMdp);
    if (retirable) {
      // le dernier compte ne se retire pas (plus personne ne pourrait se connecter)
      const bRetirer = document.createElement("button");
      bRetirer.className = "sec danger";
      bRetirer.textContent = "Retirer";
      bRetirer.addEventListener("click", function () {
        confirmerEnDeuxTemps(bRetirer, "Confirmer le retrait", function () {
          retirerUnCompte(c);
        });
      });
      actions.appendChild(bRetirer);
    }
    ligne.appendChild(texte);
    ligne.appendChild(actions);
    bloc.appendChild(ligne);
    const form = formulaireMdp(c);
    bloc.appendChild(form);
    bMdp.addEventListener("click", function () {
      form.style.display = form.style.display === "none" ? "" : "none";
      if (form.style.display === "") form.querySelector("input[type=password]").focus();
    });
    return bloc;
  }
  // Nouveau mot de passe. Pour SON compte, le formulaire est réellement envoyé (cadre
  // caché) : le navigateur propose de mettre à jour le mot de passe qu'il a retenu.
  function formulaireMdp(c) {
    const moi = estMonCompte(c);
    const form = document.createElement("form");
    form.className = "mdp-compte";
    form.style.display = "none";
    form.method = "post";
    form.target = "cibleConnexion";
    form.noValidate = true;
    form.setAttribute("autocomplete", moi ? "on" : "off");
    const champ = function (type, nom, auto, texte) {
      const i = document.createElement("input");
      i.type = type;
      if (nom) i.name = nom;
      i.setAttribute("autocomplete", auto);
      i.maxLength = 100;
      if (texte) {
        i.placeholder = texte;
        i.setAttribute("aria-label", texte);
      }
      form.appendChild(i);
      return i;
    };
    const id = champ("text", "username", moi ? "username" : "off");
    id.value = c.identifiant;
    id.readOnly = true;
    id.hidden = true;
    const m1 = champ(
      "password",
      "password",
      moi ? "new-password" : "off",
      "Nouveau mot de passe (8 car. min.)"
    );
    const m2 = champ("password", "", moi ? "new-password" : "off", "Confirmer le mot de passe");
    const rangee = document.createElement("div");
    rangee.className = "rangee-btn";
    const ok = document.createElement("button");
    ok.className = "sec accent";
    ok.type = "submit";
    ok.textContent = "Enregistrer le mot de passe";
    rangee.appendChild(ok);
    form.appendChild(rangee);
    const msg = document.createElement("div");
    msg.className = "message";
    form.appendChild(msg);
    form.addEventListener("submit", function (e) {
      msg.style.color = "var(--danger)";
      if (m1.value.length < 8) {
        e.preventDefault();
        msg.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
        return;
      }
      if (m1.value !== m2.value) {
        e.preventDefault();
        msg.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }
      if (moi && URL_APPLI) form.action = URL_APPLI;
      else e.preventDefault();
      const mdp = m1.value;
      appelAdmin("changerMotDePasse", [c.id, mdp], function (r) {
        if (!r || !r.ok) {
          msg.textContent = (r && r.message) || "Refusé.";
          return;
        }
        if (r.session) {
          // son propre compte : nouvelle session (l'ancienne ne sert plus)
          SESSION = r.session;
          ecrireStockage("cdSession", SESSION);
        }
        setTimeout(function () {
          m1.value = "";
          m2.value = "";
        }, 500);
        msg.style.color = "var(--ok)";
        msg.textContent =
          r.message +
          " Les autres appareils sont déconnectés : reconnectez-les avec le nouveau mot de passe.";
      });
    });
    return form;
  }
  function retirerUnCompte(c) {
    appelAdmin("retirerCompte", [c.id], function (r) {
      if (!r || !r.ok) {
        afficherToast((r && r.message) || "Refusé.", "error");
        return;
      }
      if (estMonCompte(c)) {
        seDeconnecter(); // son propre compte : cette session ne sert plus
        return;

      afficherToast(r.message);
      chargerComptes(true);
    });
  }
  // Code COMMUN : le changer, ou y revenir depuis les codes personnels (second appui :

  function changerPin() {
    const msg = document.getElementById("msgPin");
    const p1 = lireCodeDouble("pinNouveau", "pinNouveau2", msg);
    if (!p1) return;
    const enregistrer = function () {
      const creation = !pinDefini;
      appelAdmin("definirPin", [p1], function (r) {
        viderChamps(["pinNouveau", "pinNouveau2"]);
        if (r && r.ok) {
          jetonAdmin = r.jeton;
          pinDefini = true;
          codePersonnel = false;
          personneAdmin = "";
          majCodeAPart();
          msg.style.color = "var(--ok)";
          msg.textContent = creation
            ? "Code enregistré : il sera demandé pour ouvrir l'espace responsable."
            : "Code commun enregistré.";
        } else msg.textContent = (r && r.message) || "Refusé.";
      });
    };
    if (codePersonnel)
      confirmerEnDeuxTemps(
        document.getElementById("btnEnregistrerPin"),
        "Confirmer : codes personnels retirés",
        enregistrer
      );
    else enregistrer();
  }
  // Entrée dans les champs de code = valider
  ["pinSaisi"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        deverrouillerAdmin();
      }
    });
  });
  ["pinAPart", "pinAPart2"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        choisirCodeAPart("choisir");
      }
    });
  });
  ["pinNouveau", "pinNouveau2"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        changerPin();
      }
    });
  });
  // Dates en cours de modification : protégées du rafraîchissement automatique
  ["modalDateDebut", "modalDateFin"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      this.dataset.modifie = "1";
    });
  });
  // Réglages en cours de modification : idem
  ["input", "change"].forEach(function (evt) {
    document.querySelector('#modalParametres [data-ecran="reglages"]').addEventListener(evt, function () {
      reglagesModifies = true;
    });
  });
</script>
