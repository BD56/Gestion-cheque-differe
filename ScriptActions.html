<!-- Boutons de la page : data-action="nomDeLaFonction" (+ data-args='[…]' en JSON). -->
<script data-version="2026.10.14-1359">
  // Fonctions qu'un bouton peut appeler. Liste explicite : ESLint vérifie que chacune
  // existe, et une action inconnue est signalée au lieu d'appeler n'importe quoi.
  const ACTIONS = {
    allerAide,
    allerEcran,
    annulerCloture,
    annulerCorrection,
    annulerForcage,
    annulerForcageServeur,
    annulerSaisie,
    appairerCetteTablette,
    changerModeAnnuaire,
    changerPin,
    choisirMode,
    cloturerOffre,
    continuerEnHauteur,
    demanderCloture,
    demanderForcage,
    demanderForcageServeur,
    deverrouillerAdmin,
    enregistrerCorrection,
    enregistrerReglages,
    envoyerSaisie,
    fermerAide,
    fermerAlerteServeur,
    fermerJournal,
    fermerMentions,
    fermerPanneau,
    forcerAjout,
    forcerDepuisAlerte,
    ignorerAnnuaire,
    imprimerArchive,
    ouvrirAide,
    ouvrirArchives,
    ouvrirCodeTablettes,
    ouvrirEnsemble,
    ouvrirJournal,
    ouvrirMentions,
    ouvrirPanneau,
    ouvrirSaisies,
    preparerImpression,
    preparerImpressionAncien,
    reessayerDepuisAlerte,
    retirerToutesLesTablettes,
    sauvegarderDatesTablette,
    utiliserAnnuaire,
    verrouillerAdmin,
  };
  // Un seul écouteur pour toute la page (y compris les éléments ajoutés plus tard)
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = ACTIONS[el.dataset.action];
    if (!action) {
      console.error("Action inconnue : " + el.dataset.action);
      return;
    }
    action.apply(null, el.dataset.args ? JSON.parse(el.dataset.args) : []);
  });
</script>
