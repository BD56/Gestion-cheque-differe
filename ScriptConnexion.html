<!-- Connexion (comptes), démarrage, aide, panneau, mentions légales. -->
<script data-version="2026.10.16-1243">
  // =================================================================
  // --- CONNEXION (compte de la caisse centrale) ---
  // La session reçue à la connexion est gardée dans le navigateur et envoyée à
  // CHAQUE appel au serveur ; sans elle, le serveur refuse tout (un lien qui fuite
  // ne donne accès à rien). Elle se termine à 3 h du matin. Safari oublie le stockage
  // de la page quand on le quitte : son gestionnaire de mots de passe remplit alors
  // l'identifiant et le mot de passe.
  // =================================================================
  let STOCKAGE_OK = true;
  function lireStockage(k) {
    try {
      return window.localStorage.getItem(k);
    } catch (e) {
      STOCKAGE_OK = false;
      return null;
    }
  }
  function ecrireStockage(k, v) {
    try {
      if (v === null) window.localStorage.removeItem(k);
      else window.localStorage.setItem(k, v);
      return true;
    } catch (e) {
      STOCKAGE_OK = false;
      return false;
    }
  }
  // Jamais null / absente vers le serveur : "" = « pas de session » (seul un appel SANS
  // argument, celui du panneau du Sheet, profite du passe-droit des éditeurs).
  let SESSION = lireStockage("cdSession") || "";
  let COMPTE = lireStockage("cdCompte") || "";
  // Ancienne autorisation d'appareil (remplacée par les comptes) : effacée du navigateur
  ecrireStockage("cdTabletteCle", null);
  ecrireStockage("cdTabletteId", null);

  function oublierSession() {
    SESSION = "";
    COMPTE = "";
    ecrireStockage("cdSession", null);
    ecrireStockage("cdCompte", null);
  }
  // Session refusée par le serveur (3 h du matin passé, mot de passe changé, compte
  // retiré) ? On la jette (elle ne redeviendra jamais valable ; une panne passagère de
  // Google, elle, ne donne pas ce refus) et on redemande la connexion. La page derrière
  // reste telle quelle : une saisie en cours de frappe n'est pas perdue.
  function estRefusSession(err) {
    const m = err && err.message ? err.message : String(err || "");
    return m.indexOf("CONNEXION_REQUISE") !== -1;
  }
  function siNonAutorisee(err) {
    if (!estRefusSession(err)) return false;
    oublierSession();
    if (typeof jetonAdmin !== "undefined" && jetonAdmin) fermerPanneau();
    const n = saisiesARenvoyer.length;
    afficherEcranConnexion(
      "Session terminée : reconnectez-vous." +
        (n > 1
          ? " " + n + " saisies en attente vous seront proposées ensuite."
          : n
            ? " Une saisie en attente vous sera proposée ensuite."
            : "")
    );
    return true;
  }
  // Saisies refusées faute de session : proposées après la reconnexion (jamais envoyées
  // sans l'accord de la personne connectée), puis recontrôlées par le serveur.
  let saisiesARenvoyer = [];

  // Toutes les 5 min, page à l'écran : la connexion est-elle toujours valable (compte
  // retiré, comptes réinitialisés, 3 h du matin…) ? Sinon : écran de connexion, sans
  // attendre une action. Une panne de réseau ne déconnecte pas.
  const VERIF_SESSION_MS = 5 * 60000;
  function verifierSessionPeriodique() {
    if (!SESSION || document.hidden) return;
    if (document.getElementById("ecranConnexion").style.display === "flex") return;
    google.script.run
      .withSuccessHandler(function () {})
      .withFailureHandler(siNonAutorisee)
      .verifierSession(SESSION);
  }
  setInterval(verifierSessionPeriodique, VERIF_SESSION_MS);

  let installation = false; // aucun compte : 1re installation
  function afficherEcranConnexion(message) {
    document.getElementById("ecranConnexion").style.display = "flex";
    document.getElementById("formConnexion").style.display = "";
    document.getElementById("blocCodeAPart").style.display = "none";
    document.getElementById("blocARenvoyer").style.display = "none";
    document.getElementById("msgConnexion").textContent = message || "";
    document.getElementById("txtConnexion").textContent = "…";
    document.getElementById("btnConnexion").disabled = false;
    google.script.run
      .withSuccessHandler(function (etat) {
        installation = !etat.comptes;
        pinDefini = etat.pinDefini;
        document.getElementById("titreConnexion").textContent = installation
          ? "Première installation"
          : "Connexion";
        document.getElementById("txtConnexion").textContent = installation
          ? "Saisissez le code d'activation affiché dans le Google Sheets (menu 🚀 APPLICATION → 🔑 Code d'activation), puis créez le compte de la caisse centrale. Les autres comptes se créent ensuite dans l'espace responsable."
          : "Connectez-vous avec le compte de la caisse centrale. Le navigateur peut retenir le mot de passe.";
        document.getElementById("blocActivation").style.display = installation ? "block" : "none";
        document.getElementById("blocMotDePasse2").style.display = installation ? "block" : "none";
        document
          .getElementById("motDePasse")
          .setAttribute("autocomplete", installation ? "new-password" : "current-password");
        document.getElementById("btnConnexion").textContent = installation ? "Créer le compte" : "Connexion";
        if (!STOCKAGE_OK)
          document.getElementById("msgConnexion").textContent =
            "Ce navigateur ne peut pas garder la connexion : elle sera redemandée à chaque ouverture.";
      })
      .withFailureHandler(function () {
        document.getElementById("txtConnexion").textContent =
          "Serveur injoignable : vérifiez le Wi-Fi puis rechargez la page.";
      })
      .etatAdmin();
  }

  // Envoi du formulaire (bouton ou touche Entrée). Formulaire correct : envoi RÉEL vers
  // le cadre caché (le navigateur propose alors d'enregistrer le mot de passe) et, en
  // même temps, vérification par le serveur.
  document.getElementById("formConnexion").addEventListener("submit", function (e) {
    const id = document.getElementById("identifiant").value.trim();
    const mdp = document.getElementById("motDePasse").value;
    const msg = document.getElementById("msgConnexion");
    const refuser = function (texte, champ) {
      e.preventDefault();
      msg.textContent = texte;
      if (champ) document.getElementById(champ).focus();
    };
    msg.textContent = "";
    let activation = "";
    if (installation) {
      activation = document.getElementById("activationConnexion").value.trim();
      if (activation.replace(/\D/g, "").length !== 8)
        return refuser(
          "Saisissez le code d'activation (8 chiffres) affiché dans le Google Sheets.",
          "activationConnexion"
        );
    }
    if (normIdJS(id) === "")
      return refuser("Saisissez l'identifiant (ex. Caisse centrale 1).", "identifiant");
    if (installation && mdp.length < 8)
      return refuser("Le mot de passe doit contenir au moins 8 caractères.", "motDePasse");
    if (!mdp) return refuser("Saisissez le mot de passe.", "motDePasse");
    if (installation && mdp !== document.getElementById("motDePasse2").value)
      return refuser("Les deux mots de passe ne correspondent pas.", "motDePasse2");
    if (URL_APPLI) this.action = URL_APPLI;
    else e.preventDefault(); // pas d'adresse (essais hors Apps Script) : vérification seule
    const btn = document.getElementById("btnConnexion");
    btn.disabled = true;
    const runner = google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        if (!r || !r.ok) {
          msg.textContent = (r && r.message) || "Refusé.";
          return;
        }
        connecte(r, installation);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        msg.textContent = "Erreur : " + (err && err.message ? err.message : err);
      });
    if (installation) runner.premierCompte(activation, id, mdp);
    else runner.connexion(id, mdp);
  });

  function connecte(r, premier) {
    SESSION = r.session;
    COMPTE = r.compte.identifiant;
    ecrireStockage("cdSession", SESSION);
    ecrireStockage("cdCompte", COMPTE);
    // Champs vidés APRÈS l'envoi (le navigateur a déjà lu l'identifiant et le mot de passe)
    setTimeout(function () {
      ["motDePasse", "motDePasse2", "activationConnexion"].forEach(function (id) {
        document.getElementById(id).value = "";
      });
    }, 500);
    if (premier) {
      // 1er compte : code responsable à part ? S'il en existe un d'avant, on le dit
      // seulement : le changer demande ce code (le code d'activation n'en tient pas lieu).
      document.getElementById("formConnexion").style.display = "none";
      document.getElementById("msgConnexion").textContent = "";
      document.getElementById("titreConnexion").textContent = "Compte créé";
      document.getElementById("txtConnexion").textContent =
        "« " + COMPTE + " » est connecté sur cet appareil.";
      document.getElementById("txtCodeAPart").textContent = pinDefini
        ? "Un code responsable existe déjà (choisi avant) : il sera demandé pour ouvrir l'espace responsable. Pour le changer ou ne plus en demander : espace responsable → Code & comptes, avec ce code. Vous ne le connaissez pas ? Le panneau ⚙️ du Google Sheets le réinitialise."
        : "Protéger l'espace responsable ? Un code commun (6 chiffres, connu de l'équipe), ou des codes personnels (un par personne : le journal note qui a fait quoi). Sans code, tout compte connecté l'ouvre directement. Modifiable ensuite dans l'espace responsable.";
      ["btnCodeAPartOui", "btnCodeAPartPerso", "btnCodeAPartNon"].forEach(function (id) {
        document.getElementById(id).style.display = pinDefini ? "none" : "";
      });
      document.getElementById("btnCodeAPartGarder").style.display = pinDefini ? "" : "none";
      document.getElementById("btnCodeAPartOui").textContent = "Oui, un code commun";
      document.getElementById("btnCodeAPartPerso").textContent = "Oui, des codes personnels";
      document.getElementById("btnCodeAPartNon").textContent = "Non, pas de code";
      document.getElementById("champsCodeAPart").style.display = "none";
      choixCodeAPart = "";
      document.getElementById("blocCodeAPart").style.display = "block";
      return;
    }
    fermerEcranConnexion();
  }
  function fermerEcranConnexion() {
    if (saisiesARenvoyer.length) {
      afficherSaisiesARenvoyer();
      return;
    }
    document.getElementById("blocARenvoyer").style.display = "none";
    document.getElementById("ecranConnexion").style.display = "none";
    demarrerApplication();
  }
  // Saisies validées pendant une session déjà terminée : la personne connectée décide.
  function afficherSaisiesARenvoyer() {
    const n = saisiesARenvoyer.length;
    document.getElementById("formConnexion").style.display = "none";
    document.getElementById("blocCodeAPart").style.display = "none";
    document.getElementById("msgConnexion").textContent = "";
    document.getElementById("titreConnexion").textContent = "Saisies en attente";
    document.getElementById("txtConnexion").textContent = "« " + COMPTE + " » est connecté.";
    document.getElementById("txtARenvoyer").textContent =
      (n > 1 ? n + " saisies validées" : "Une saisie validée") +
      " après la fin de la session précédente " +
      (n > 1 ? "n'ont pas été enregistrées" : "n'a pas été enregistrée") +
      (n > 1
        ? ". Les enregistrer maintenant ? Le serveur les vérifie comme toujours (doublons, période)."
        : ". L'enregistrer maintenant ? Le serveur la vérifie comme toujours (doublons, période).");
    const liste = document.getElementById("listeARenvoyer");
    liste.textContent = "";
    saisiesARenvoyer.forEach(function (s) {
      const li = document.createElement("li");
      li.textContent = [s.heure || "", nomAbrege(s), pieceMasquee(s.piece), s.montant || ""]
        .filter(function (x) {
          return x;
        })
        .join(" · ");
      liste.appendChild(li);
    });
    document.getElementById("btnARenvoyerOui").textContent = n > 1 ? "Enregistrer les " + n : "Enregistrer";
    document.getElementById("blocARenvoyer").style.display = "block";
  }
  function deciderSaisiesARenvoyer(envoyer) {
    const terminer = function () {
      const a = envoyer ? saisiesARenvoyer : [];
      saisiesARenvoyer = [];
      fermerEcranConnexion();
      a.forEach(envoyerEnArrierePlan);
    };
    if (envoyer) terminer();
    else
      confirmerEnDeuxTemps(
        document.getElementById("btnARenvoyerNon"),
        "Confirmer : ne pas enregistrer",
        terminer
      );
  }

  // Après le 1er compte, sans code d'avant : « choisir » le code (2 fois) ou « aucun ».
  // Avec un code d'avant : « garder » (seul choix ici).
  // « personnels » : codes personnels (votre nom + votre code ; les autres s'ajoutent
  // ensuite dans l'espace responsable).
  let choixCodeAPart = "";
  function choisirCodeAPart(choix) {
    const msg = document.getElementById("msgCodeAPart");
    msg.textContent = "";
    if (choix !== "choisir" && choix !== "personnels") {
      fermerEcranConnexion();
      return;
    }
    const perso = choix === "personnels";
    if (choixCodeAPart !== choix) {
      // 1er appui : les champs du choix ; l'autre « Oui » disparaît
      choixCodeAPart = choix;
      document.getElementById("champsCodeAPart").style.display = "block";
      document.getElementById("blocNomAPart").style.display = perso ? "block" : "none";
      document.getElementById("lblPinAPart").textContent = perso
        ? "Votre code personnel (6 chiffres)"
        : "Code responsable (6 chiffres)";
      document.getElementById(perso ? "btnCodeAPartOui" : "btnCodeAPartPerso").style.display = "none";
      document.getElementById(perso ? "btnCodeAPartPerso" : "btnCodeAPartOui").textContent = perso
        ? "Enregistrer mon code"
        : "Enregistrer le code";
      document.getElementById(perso ? "nomAPart" : "pinAPart").focus();
      return;
    }
    const nom = document.getElementById("nomAPart").value.trim();
    if (perso && normIdJS(nom) === "") {
      msg.textContent = "Saisissez votre nom.";
      return;
    }
    const pin = document.getElementById("pinAPart").value.trim();
    if (!/^\d{6}$/.test(pin)) {
      msg.textContent = "Le code doit contenir exactement 6 chiffres.";
      return;
    }
    if (pin !== document.getElementById("pinAPart2").value.trim()) {
      msg.textContent = "Les deux codes ne correspondent pas.";
      return;
    }
    const runner = google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.ok) {
          msg.textContent = (r && r.message) || "Refusé.";
          return;
        }
        pinDefini = true;
        codePersonnel = perso;
        document.getElementById("pinAPart").value = "";
        document.getElementById("pinAPart2").value = "";
        fermerEcranConnexion();
      })
      .withFailureHandler(function (err) {
        if (!siNonAutorisee(err)) msg.textContent = "Erreur : " + (err && err.message ? err.message : err);
      });
    if (perso) runner.passerCodesPersonnels(nom, pin, null, SESSION);
    else runner.definirPin(pin, null, SESSION);
  }

  // Se déconnecter : cet appareil oublie la session (un autre compte pourra se connecter)
  function seDeconnecter() {
    oublierSession();
    fermerPanneau();
    afficherEcranConnexion("Déconnecté.");
  }

  // Lance l'application (une fois connecté)
  // Un seul appel au serveur : mode, dates à jour et cache de vérification (ce
  // dernier seulement si l'offre est en cours).
  function demarrerApplication() {
    const seq = ++seqCache;
    google.script.run
      .withSuccessHandler(function (rep) {
        const infos = rep.infos;
        if (infos.success) {
          majAffichageMode(infos.mode);
          if (infos.annuaireActif) majAffichageModeAnnuaire(infos.modeAnnuaire);
        }
        if (rep.config) appliquerConfig(rep.config);
        if (rep.cache && seq >= seqCacheApplique) {
          seqCacheApplique = seq;
          appliquerCopie(rep.cache); // copie complète (annuaire compris)
          fusionnerEnAttente();
        }
        appliquerDates(rep.dates);
      })
      .withFailureHandler(function (err) {
        if (siNonAutorisee(err)) return;
        // serveur injoignable : on le dit, et on réessaie tout seul
        afficherMessage(
          "Connexion au serveur impossible : nouvel essai dans 20 s (vérifiez le Wi-Fi).",
          "error"
        );
        setTimeout(function () {
          if (SESSION) demarrerApplication();
        }, 20000);
      })
      .demarrage(SESSION);
  }

  window.onload = function () {
    const auj = new Date();
    const annee = auj.getFullYear();
    const mois = ("0" + (auj.getMonth() + 1)).slice(-2);
    const jour = ("0" + auj.getDate()).slice(-2);
    document.getElementById("dateImpression").value = annee + "-" + mois + "-" + jour;
    if (SESSION) demarrerApplication();
    else afficherEcranConnexion();
  };

  // --- Tablette tenue en hauteur : invitation à la tourner (jamais bloquante) ---
  // Seulement sur écran tactile : une fenêtre d'ordinateur étroite n'est pas concernée.
  // « Continuer en hauteur » vaut jusqu'à la prochaine ouverture de l'application.
  const EN_HAUTEUR = window.matchMedia
    ? window.matchMedia("(orientation: portrait) and (pointer: coarse)")
    : null;
  let accepteEnHauteur = false;
  try {
    accepteEnHauteur = window.sessionStorage.getItem("cdEnHauteur") === "oui";
  } catch (e) {
    accepteEnHauteur = false;
  }
  function majOrientation() {
    const afficher = !!EN_HAUTEUR && EN_HAUTEUR.matches && !accepteEnHauteur;
    document.getElementById("ecranTourner").style.display = afficher ? "flex" : "none";
  }
  function continuerEnHauteur() {
    accepteEnHauteur = true;
    try {
      window.sessionStorage.setItem("cdEnHauteur", "oui");
    } catch (e) {
      // navigateur sans mémoire de session : accepté jusqu'au rechargement
    }
    majOrientation();
  }
  if (EN_HAUTEUR) {
    if (EN_HAUTEUR.addEventListener) EN_HAUTEUR.addEventListener("change", majOrientation);
    else if (EN_HAUTEUR.addListener) EN_HAUTEUR.addListener(majOrientation); // anciens Safari
  }
  majOrientation();

  // Aide : ouvrir / fermer
  function ouvrirAide() {
    allerAide("accueil");
    document.getElementById("modalAide").style.display = "flex";
  }
  // Aide : accueil (tuiles) <-> une rubrique par écran
  function allerAide(nom) {
    const ecrans = document.querySelectorAll("#modalAide .sous-ecran");
    for (let i = 0; i < ecrans.length; i++)
      ecrans[i].classList.toggle("actif", ecrans[i].getAttribute("data-aide") === nom);
    document.querySelector("#modalAide .modal-content").scrollTop = 0;
  }
  function fermerAide() {
    document.getElementById("modalAide").style.display = "none";
  }

  function ouvrirPanneau() {
    document.getElementById("modalParametres").style.display = "flex";
    if (jetonAdmin) afficherZoneAdmin();
    else afficherZoneVerrou();
  }
  // Fermer le panneau reverrouille l'espace responsable.
  function fermerPanneau() {
    document.getElementById("modalParametres").style.display = "none";
    verrouillerAdmin();
  }
  function ouvrirMentions() {
    document.getElementById("modalMentions").style.display = "flex";
  }
  function fermerMentions() {
    document.getElementById("modalMentions").style.display = "none";
  }
</script>
