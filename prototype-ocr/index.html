<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype OCR MRZ — Pièces d'identité françaises</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#f4f7f6; margin:0; padding:16px; color:#3c4043; }
    .wrap { max-width:760px; margin:0 auto; }
    h1 { font-size:20px; }
    .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab { flex:1; padding:10px; border:2px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; font-weight:bold; font-size:14px; }
    .tab.active { border-color:#1a73e8; color:#1a73e8; }
    button.action { width:100%; padding:14px; font-size:16px; font-weight:bold; color:#fff; background:#1a73e8; border:none; border-radius:8px; cursor:pointer; }
    button.action:disabled { background:#9aa0a6; cursor:not-allowed; }
    video, #preview { width:100%; border-radius:8px; background:#000; display:block; margin-bottom:10px; }
    #preview { background:#eee; }
    input[type=file] { width:100%; font-size:15px; }
    label.opt { display:flex; align-items:center; gap:8px; font-size:14px; margin:10px 0; }
    .status { font-size:14px; color:#5f6368; margin-top:10px; min-height:20px; }
    .progress { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin-top:8px; }
    .progress > div { height:100%; width:0; background:#1a73e8; transition:width .2s; }
    pre { background:#f1f3f4; padding:10px; border-radius:8px; overflow-x:auto; font-size:13px; white-space:pre-wrap; word-break:break-all; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    td, th { border:1px solid #e0e0e0; padding:8px; text-align:left; }
    th { background:#f1f3f4; width:42%; }
    .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-weight:bold; font-size:13px; }
    .ok { background:#d4edda; color:#155724; }
    .ko { background:#f8d7da; color:#721c24; }
    .map { background:#e8f0fe; border-radius:8px; padding:12px; margin-top:12px; }
    .map div { margin:4px 0; font-size:15px; }
    .hidden { display:none; }
    .note { font-size:13px; color:#856404; background:#fff3cd; border:1px solid #ffeeba; border-radius:8px; padding:10px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🪪 Prototype OCR — bande MRZ</h1>
  <p style="font-size:14px; color:#5f6368;">Passeport · nouvelle CNI · ancienne CNI · titre de séjour. Tout se passe <b>dans le navigateur</b> (aucune image envoyée ailleurs).</p>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabCam">📷 Caméra</button>
      <button class="tab" id="tabFile">🖼️ Importer / Photo</button>
    </div>

    <!-- Mode caméra -->
    <div id="paneCam">
      <video id="video" playsinline autoplay muted></video>
      <button class="action" id="btnCapture">📸 Capturer</button>
      <div id="camErr" class="note hidden" style="margin-top:10px;"></div>
    </div>

    <!-- Mode fichier -->
    <div id="paneFile" class="hidden">
      <input type="file" id="file" accept="image/*" capture="environment">
    </div>

    <label class="opt"><input type="checkbox" id="optCrop" checked> Rogner le bas de l'image (zone MRZ) — désactive si la MRZ n'est pas captée</label>
    <label class="opt"><input type="checkbox" id="optBin"> Binariser (noir & blanc, seuil Otsu) — à essayer si l'OCR rate</label>

    <canvas id="canvas" class="hidden"></canvas>
    <img id="preview" class="hidden" alt="aperçu">

    <button class="action" id="btnAnalyse" disabled>🔍 Analyser la MRZ</button>
    <div class="progress hidden" id="progWrap"><div id="progBar"></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="resCard">
    <h2 style="font-size:16px;">Résultat</h2>
    <div id="validity"></div>

    <div class="map" id="mapBox">
      <b>➡️ Pré-remplissage du formulaire</b>
      <div>Nom : <b id="mNom">—</b></div>
      <div>Prénom : <b id="mPrenom">—</b></div>
      <div>N° de pièce : <b id="mPiece">—</b></div>
    </div>

    <h3 style="font-size:14px; margin-top:16px;">Champs extraits</h3>
    <table id="fieldsTable"><tbody></tbody></table>

    <h3 style="font-size:14px; margin-top:16px;">Lignes MRZ retenues</h3>
    <pre id="mrzLines">—</pre>

    <h3 style="font-size:14px;">Texte OCR brut</h3>
    <pre id="rawText">—</pre>
  </div>
</div>

<!-- Tesseract.js (OCR, global window.Tesseract) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script type="module">
  // Librairie de parsing MRZ (gère TD1 / TD3 / ancienne CNI française), en module ESM
  import { parse } from 'https://esm.sh/mrz@3';

  const $ = (id) => document.getElementById(id);
  let currentImage = null; // ImageBitmap / HTMLImageElement source à analyser
  let stream = null;

  // ---------- Bascule des onglets ----------
  $('tabCam').onclick  = () => switchMode('cam');
  $('tabFile').onclick = () => switchMode('file');

  function switchMode(mode) {
    const cam = mode === 'cam';
    $('tabCam').classList.toggle('active', cam);
    $('tabFile').classList.toggle('active', !cam);
    $('paneCam').classList.toggle('hidden', !cam);
    $('paneFile').classList.toggle('hidden', cam);
    if (cam) startCamera(); else stopCamera();
  }

  // ---------- Caméra live (getUserMedia) ----------
  async function startCamera() {
    $('camErr').classList.add('hidden');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      $('video').srcObject = stream;
    } catch (e) {
      // Cas fréquent : iframe sandboxé (Apps Script) ou contexte non sécurisé (file://)
      $('camErr').textContent = "⚠️ Caméra indisponible (" + e.name + "). "
        + "Causes possibles : page ouverte en file:// (il faut https/localhost), "
        + "permission refusée, ou iframe sans autorisation caméra. → Utilise l'onglet « Importer / Photo ».";
      $('camErr').classList.remove('hidden');
    }
  }
  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  $('btnCapture').onclick = async () => {
    const v = $('video');
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    setSource(c);
  };

  // ---------- Import / photo ----------
  $('file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => setSource(img);
    img.src = URL.createObjectURL(f);
  };

  // ---------- Source commune ----------
  function setSource(imgOrCanvas) {
    currentImage = imgOrCanvas;
    const url = imgOrCanvas.tagName === 'CANVAS' ? imgOrCanvas.toDataURL() : imgOrCanvas.src;
    $('preview').src = url;
    $('preview').classList.remove('hidden');
    $('btnAnalyse').disabled = false;
    $('status').textContent = "Image prête. Clique sur « Analyser ».";
  }

  // ---------- Préparation de l'image pour l'OCR ----------
  // Seuil automatique d'Otsu (binarisation robuste)
  function otsu(gray) {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
    const total = gray.length;
    let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, varMax = 0, thr = 0;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (wB === 0) continue;
      const wF = total - wB; if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > varMax) { varMax = between; thr = t; }
    }
    return thr;
  }

  // Tourne l'image source de `angle` degrés et renvoie un canvas plein
  function canvasRotation(angle) {
    const src = currentImage;
    const sw = src.videoWidth || src.naturalWidth || src.width;
    const sh = src.videoHeight || src.naturalHeight || src.height;
    const rot = document.createElement('canvas');
    if (angle === 90 || angle === 270) { rot.width = sh; rot.height = sw; }
    else { rot.width = sw; rot.height = sh; }
    const ctx = rot.getContext('2d');
    ctx.translate(rot.width / 2, rot.height / 2);
    ctx.rotate(angle * Math.PI / 180);
    ctx.drawImage(src, -sw / 2, -sh / 2);
    return rot;
  }

  function buildCanvas(angle, cropOverride) {
    const rot = canvasRotation(angle || 0); // 1) orientation
    const w = rot.width, h = rot.height;

    // 2) Rognage optionnel du bas (après rotation, la MRZ est en bas).
    //    cropOverride permet de forcer (ex: désactivé pour 90°/270° où la
    //    position de la MRZ est moins prévisible).
    const crop = (cropOverride === undefined) ? $('optCrop').checked : cropOverride;
    const sy = crop ? Math.floor(h * 0.62) : 0;
    const sh = crop ? h - sy : h;

    // 3) Upscale pour aider l'OCR (plus de résolution si on ne rogne pas)
    const targetW = crop ? 1800 : 2200;
    const scale = Math.min(4, Math.max(1, targetW / w));
    const c = $('canvas');
    c.width = Math.round(w * scale);
    c.height = Math.round(sh * scale);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(rot, 0, sy, w, sh, 0, 0, c.width, c.height);

    // Niveaux de gris (le modèle LSTM s'en sort mieux sur du gris propre que sur
    // une binarisation brutale). Binarisation Otsu seulement si l'utilisateur l'active.
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    const gray = new Uint8ClampedArray(d.length / 4);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    }
    const thr = $('optBin').checked ? otsu(gray) : -1;
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const v = thr >= 0 ? (gray[j] > thr ? 255 : 0) : gray[j];
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // ---------- Création du worker OCR : modèle MRZ dédié, repli sur eng ----------
  const MRZ_LANGPATH = 'https://raw.githubusercontent.com/DoubangoTelecom/tesseractMRZ/master/tessdata_best';
  async function creerWorker(logger) {
    try {
      const w = await Tesseract.createWorker('mrz', 1, { langPath: MRZ_LANGPATH, gzip: false, logger });
      return { worker: w, modele: 'MRZ (OCR-B)' };
    } catch (e) {
      const w = await Tesseract.createWorker('eng', 1, { logger });
      return { worker: w, modele: 'eng (repli — modèle MRZ non chargé)' };
    }
  }

  // ---------- Lancement OCR + parsing ----------
  $('btnAnalyse').onclick = async () => {
    if (!currentImage) return;
    $('btnAnalyse').disabled = true;
    $('resCard').classList.add('hidden');
    $('progWrap').classList.remove('hidden');
    $('status').textContent = "Chargement du moteur OCR…";

    try {
      const logger = m => {
        if (m.status === 'recognizing text') $('progBar').style.width = Math.round(m.progress * 100) + '%';
      };
      $('status').textContent = "Chargement du modèle MRZ (~11 Mo au 1er lancement, mis en cache ensuite)…";
      const { worker, modele } = await creerWorker(logger);
      // Restreindre au jeu de caractères MRZ + traiter comme un bloc de texte
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',
        tessedit_pageseg_mode: '6'
      });

      // ROTATION AUTO : on essaie plusieurs orientations et on garde la première
      // dont les check digits valident. Sinon on garde le meilleur résultat exploitable.
      const orientations = [0, 180, 90, 270];
      let choisi = null, repli = null;
      for (let k = 0; k < orientations.length; k++) {
        const angle = orientations[k];
        $('status').textContent = "Lecture OCR — orientation " + angle + "° (" + (k + 1) + "/4)…";
        $('progBar').style.width = '0%';
        // Pour 90°/270°, on n'utilise pas le rognage du bas (position MRZ moins fiable)
        const cropOverride = (angle === 90 || angle === 270) ? false : undefined;
        const { data } = await worker.recognize(buildCanvas(angle, cropOverride));
        const lignes = extraireLignes(data.text);
        const r = lignes.length ? tenterParse(lignes) : null;
        const candidat = { texte: data.text, lignes, r, angle };
        if (r && r.valid) { choisi = candidat; break; } // succès : on s'arrête
        if (!repli || (r && !repli.r)) repli = candidat; // garde le meilleur à défaut
      }
      await worker.terminate();

      afficher(choisi || repli, modele);
    } catch (e) {
      $('status').textContent = "❌ Erreur OCR : " + e.message;
    } finally {
      $('progWrap').classList.add('hidden');
      $('btnAnalyse').disabled = false;
    }
  };

  // ---------- Nettoyage + extraction des lignes MRZ ----------
  function extraireLignes(texte) {
    return texte.toUpperCase().split('\n')
      .map(l => l.replace(/ /g, '<').replace(/[^A-Z0-9<]/g, ''))
      .filter(l => l.length >= 28);
  }

  // Normalise une ligne à une longueur cible (pad avec < ou tronque)
  function ajuster(ligne, len) {
    if (ligne.length === len) return ligne;
    if (ligne.length > len) return ligne.slice(0, len);
    return ligne + '<'.repeat(len - ligne.length);
  }

  // Essaie les combinaisons de format MRZ et renvoie le 1er parse réussi/valide
  function tenterParse(lignes) {
    const n = lignes.length;
    const dernieres = (k) => lignes.slice(Math.max(0, n - k));
    const essais = [];

    if (n >= 3) { // TD1 : nouvelle CNI / titre de séjour (3 × 30)
      essais.push(dernieres(3).map(l => ajuster(l, 30)));
    }
    if (n >= 2) {
      essais.push(dernieres(2).map(l => ajuster(l, 44))); // TD3 : passeport (2 × 44)
      essais.push(dernieres(2).map(l => ajuster(l, 36))); // ancienne CNI FR (2 × 36)
    }

    let dernierResultat = null;
    for (const lignesEssai of essais) {
      try {
        const r = parse(lignesEssai);
        if (r.valid) return r;        // parfait : check digits OK
        dernierResultat = dernierResultat || r; // garde le 1er à défaut
      } catch (_) { /* format non reconnu pour cette combinaison */ }
    }
    return dernierResultat;
  }

  // Numéro de document complet (indépendant de la version de la lib mrz).
  // Ancienne CNI : le n° imprimé (12 car.) = issueDate + administrativeCode2 +
  // documentNumber (= les 12 premiers caractères de la 2e ligne MRZ).
  function numeroComplet(r) {
    const f = r.fields;
    if (r.format === 'FRENCH_NATIONAL_ID') {
      return (f.issueDate || '') + (f.administrativeCode2 || '') + (f.documentNumber || '');
    }
    return r.documentNumber || f.documentNumber || '';
  }

  function afficher(res, modele) {
    const { texte, lignes, r, angle } = res;
    $('rawText').textContent = (texte || '(vide)') + '\n\n[modèle : ' + modele + ' · orientation retenue : ' + angle + '°]';
    $('mrzLines').textContent = lignes.length ? lignes.join('\n') : '(aucune ligne de type MRZ détectée)';
    $('resCard').classList.remove('hidden');

    if (!r) {
      $('validity').innerHTML = '<span class="badge ko">❌ Aucune MRZ exploitable</span> '
        + '<span style="font-size:13px;color:#5f6368;">Vérifie le cadrage / la netteté, ou décoche le rognage.</span>';
      $('fieldsTable').querySelector('tbody').innerHTML = '';
      setMap('—', '—', '—');
      return;
    }

    // Badge de validité (basé sur les check digits) + orientation utilisée
    const ori = ' · ' + angle + '°';
    $('validity').innerHTML = r.valid
      ? '<span class="badge ok">✅ MRZ valide (check digits OK) — ' + r.format + ori + '</span>'
      : '<span class="badge ko">⚠️ Lecture incertaine (check digits KO) — ' + r.format + ori + '</span>';

    // Numéro de document COMPLET : la lib expose le n° complet à la racine
    // (r.documentNumber). Pour l'ancienne CNI il est reconstitué sur 12 caractères,
    // alors que fields.documentNumber n'en contient qu'une sous-partie (5 car.).
    const f = r.fields;
    const numComplet = numeroComplet(r);
    const labels = {
      documentCode:'Type', issuingState:'État émetteur', lastName:'Nom', firstName:'Prénom(s)',
      documentNumber:'N° document (complet)', nationality:'Nationalité', birthDate:'Naissance (AAMMJJ)',
      sex:'Sexe', expirationDate:'Expiration (AAMMJJ)', personalNumber:'N° personnel'
    };
    const tb = $('fieldsTable').querySelector('tbody');
    tb.innerHTML = '';
    for (const [k, lbl] of Object.entries(labels)) {
      const val = (k === 'documentNumber') ? numComplet : f[k];
      if (val != null && val !== '') {
        tb.insertAdjacentHTML('beforeend', `<tr><th>${lbl}</th><td>${val}</td></tr>`);
      }
    }

    setMap(f.lastName || '—', f.firstName || '—', numComplet || '—');
  }

  function setMap(nom, prenom, piece) {
    $('mNom').textContent = nom;
    $('mPrenom').textContent = prenom;
    $('mPiece').textContent = piece;
  }

  // Démarrage en mode caméra
  switchMode('cam');
</script>
</body>
</html>
